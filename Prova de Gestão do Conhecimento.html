<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prova de Gestão do Conhecimento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: cuaderno de estudio de Gestão do Conhecimento. Barra lateral fija en escritorio y barra inferior en el móvil;
   columna de lectura de ~70ch, marca-texto amarillo en los términos clave, chips de página del e-book y sellos para los estados.
   Tinta azul de cuaderno como acento; ámbar = conhecimento tácito, azul = explícito. */
:root{
  --paper:#F3F4F7; --surface:#FFFFFF; --surface-2:#E8EAF0; --ink:#151A2B; --ink-2:#525A70; --line:#D5D9E3;
  --accent:#2D4FA3; --accent-ink:#FFFFFF; --accent-soft:#DFE5F5;
  --marker:#F6D84C; --marker-ink:#151A2B;
  --good:#1D7A46; --good-soft:#DDF0E4; --bad:#B42318; --bad-soft:#F9E3E0; --warn:#8C5E05; --warn-soft:#F5EBD2;
  --sp-1:#2D4FA3; --sp-2:#9A5B12; --sp-3:#5A48A8; --sp-4:#0A6B6B;
  --shadow:0 1px 0 rgba(21,26,43,.05), 0 10px 24px -16px rgba(21,26,43,.35);
  --font-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F121B; --surface:#161B27; --surface-2:#1D2332; --ink:#E4E8F2; --ink-2:#9CA4B8; --line:#2C3446;
    --accent:#8FA8F0; --accent-ink:#0B1430; --accent-soft:#1F2A48;
    --marker:#6F5B13; --marker-ink:#FFF5CC;
    --good:#4CC183; --good-soft:#132D1E; --bad:#F27B6E; --bad-soft:#381915; --warn:#E4B04C; --warn-soft:#32280F;
    --sp-1:#8FA8F0; --sp-2:#E0A458; --sp-3:#A898F0; --sp-4:#3DB5AC;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F121B; --surface:#161B27; --surface-2:#1D2332; --ink:#E4E8F2; --ink-2:#9CA4B8; --line:#2C3446;
  --accent:#8FA8F0; --accent-ink:#0B1430; --accent-soft:#1F2A48;
  --marker:#6F5B13; --marker-ink:#FFF5CC;
  --good:#4CC183; --good-soft:#132D1E; --bad:#F27B6E; --bad-soft:#381915; --warn:#E4B04C; --warn-soft:#32280F;
  --sp-1:#8FA8F0; --sp-2:#E0A458; --sp-3:#A898F0; --sp-4:#3DB5AC;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 24px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
b,strong{font-weight:700}

/* ---------- Shell ---------- */
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--font-display);font-weight:800;font-stretch:110%;font-size:15px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--font-display);font-stretch:108%;font-weight:800;font-size:15px;line-height:1.1}
.brand span.brand-s{display:block;font-size:12px;color:var(--ink-2)}
.sync{font-family:var(--font-mono);font-size:11px;flex:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.sync[data-mode="cloud"]::before{background:var(--good)}
.sync[data-mode="local"]::before{background:var(--warn)}
.sync[data-mode="error"]::before{background:var(--bad)}

.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 112px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;color:var(--ink-2);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--accent);font-weight:700}
.tabbar svg,.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

@media (min-width:960px){
  .app{grid-template-columns:252px minmax(0,1fr)}
  .mtop,.tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:24px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .nav{display:flex;flex-direction:column;gap:4px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700}
  .nav a:hover{background:var(--surface-2)}
  .nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .rail-foot p{margin:0;font-size:12px;color:var(--ink-2)}
  .main{padding-block:40px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}

/* ---------- Type ---------- */
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
h1{font-weight:800;font-stretch:112%;font-size:clamp(30px,6vw,46px);line-height:1.02;letter-spacing:-.015em}
h2{font-weight:800;font-stretch:106%;font-size:22px;line-height:1.15}
h3{font-weight:700;font-stretch:104%;font-size:19px;line-height:1.2}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:17px;max-width:60ch}
mark{background:linear-gradient(transparent 14%,var(--marker) 14%,var(--marker) 90%,transparent 90%);color:var(--marker-ink);padding:0 .12em;border-radius:2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.art{display:inline-block;font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;white-space:nowrap;vertical-align:.12em;letter-spacing:0;font-stretch:100%}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07);border-color:var(--accent)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:10px}
.btn-quiet:hover{background:var(--accent-soft);border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row-between{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input[type="date"],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical;line-height:1.5}
input[type="date"]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer}
label.check input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

/* Sello (carimbo) */
.stamp{display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp,var(--accent));border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:4px;padding:2px 8px;transform:rotate(-3deg);white-space:nowrap}

/* ---------- Panel ---------- */
.hero{display:grid;gap:14px;position:relative}
.hero-sub{color:var(--ink-2);font-size:17px;max-width:58ch}
.count{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:16px 18px;border:1.5px dashed var(--line);border-radius:var(--r)}
.count-big{display:flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:800;font-stretch:112%;font-size:44px;line-height:1;color:var(--bad)}
.count-big small{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.count p{font-size:14px;color:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.tile-n{font-family:var(--font-display);font-weight:800;font-stretch:108%;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.tile-n small{font-size:16px;color:var(--ink-2);font-weight:700}
.tile-l{font-size:13px;color:var(--ink-2)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.next{display:grid;gap:12px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.next .eyebrow{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.next h2{color:var(--paper)}
.next p{color:color-mix(in srgb,var(--paper) 78%,transparent)}
.next .btn-primary{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.prof-list{display:grid;gap:14px}
.prof-row{display:grid;gap:8px}
.prof-row .eyebrow{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.lnk.done::after{content:"✓";color:var(--good)}
.lnk.plain{font-weight:400;color:var(--ink-2);cursor:default}
.mastery{display:grid;gap:10px}
.m-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.m-name{font-weight:700;font-size:15px;min-width:0}
.m-pct{font-family:var(--font-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.m-bar{grid-column:1/-1;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.m-bar i{display:block;height:100%;border-radius:8px}
.m-act{grid-column:1/-1;justify-self:start}
@media (min-width:640px){
  .m-row{grid-template-columns:200px minmax(0,1fr) 92px auto}
  .m-bar{grid-column:auto}
  .m-act{grid-column:auto}
}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--ink-2);font-family:var(--font-mono);font-size:11px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt-last{fill:var(--accent)}
.chart .val{fill:var(--ink);font-family:var(--font-mono);font-size:12px;font-weight:600}
.hist{display:grid;gap:0;margin-top:8px}
.hist-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist-row b{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--ink-2);font-size:15px}

/* ---------- Lista de módulos ---------- */
.mlist{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mrow:hover{border-color:var(--accent)}
.mrow-n{grid-row:span 3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:18px;background:var(--surface-2);color:var(--ink)}
.mrow.done .mrow-n{background:var(--accent);color:var(--accent-ink)}
.mrow-t{font-family:var(--font-display);font-weight:800;font-stretch:104%;font-size:18px;line-height:1.2}
.mrow-s{font-size:14px;color:var(--ink-2)}
.mrow-m{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.prio{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.prio-3{background:var(--bad-soft);color:var(--bad)}
.prio-2{background:var(--warn-soft);color:var(--warn)}
.tag{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.fast{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--ink-2)}
.fast a{font-family:var(--font-mono);font-weight:600;text-decoration:none;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink)}

/* ---------- Módulo ---------- */
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mod-head{display:grid;gap:10px}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.summary h2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.summary ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
.summary li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;counter-increment:s}
.summary li::before{content:counter(s);font-family:var(--font-mono);font-weight:600;font-size:13px;color:var(--accent);padding-top:2px}
.lesson{display:grid;gap:16px;font-size:17px;line-height:1.62}
.lesson > *{min-width:0}
.lesson h3{margin-top:14px;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.lesson p{max-width:70ch}
.lead{font-size:19px;line-height:1.55}
.lesson ul.clean{margin:0;padding-left:20px;display:grid;gap:8px}
.box{border-radius:var(--r);padding:16px 18px;display:grid;gap:8px;font-size:16px}
.box p{max-width:none}
.box-h{justify-self:start;display:inline-block;font-family:var(--font-mono);font-weight:600;font-size:11px;letter-spacing:.11em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:4px;padding:1px 8px;transform:rotate(-1.5deg)}
.box.prova{background:var(--accent-soft)} .box.prova .box-h{color:var(--accent)}
.box.trap{background:var(--bad-soft)} .box.trap .box-h{color:var(--bad)}
.box.tech{background:var(--warn-soft)} .box.tech .box-h{color:var(--warn)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{width:100%;border-collapse:collapse;font-size:15px;min-width:460px}
.cmp th,.cmp td{padding:11px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.cmp thead th{border-top:0;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:600;background:var(--surface-2)}
.cmp tbody th{color:var(--ink-2);font-weight:700;font-size:14px;width:28%}
.sides{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:4px;font-size:15px}
.side b{font-family:var(--font-display);font-size:18px;font-stretch:104%}
.side-link{display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.side-link span{border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);padding:4px 8px}
@media (min-width:640px){.sides{grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);align-items:center}}
.balance{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:22px}
.balance::before{content:"";position:absolute;top:6px;left:18%;right:18%;height:4px;border-radius:4px;background:var(--ink)}
.pan{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px}
.pan::before{content:"";position:absolute;top:-16px;left:50%;width:2px;height:16px;background:var(--ink-2)}
.pan b{font-family:var(--font-display);font-size:17px}
.fulcrum{grid-column:1/-1;display:grid;justify-items:center;gap:2px;text-align:center;font-size:15px;padding-top:4px}
.fulcrum::before{content:"";width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:22px solid var(--ink);margin-bottom:6px}
.fulcrum b{font-family:var(--font-display);font-size:17px}
.fulcrum span{color:var(--ink-2)}
ol.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;counter-reset:f}
ol.flow li{counter-increment:f;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px}
ol.flow li::before{content:"0" counter(f);font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600}
ol.flow li b{font-family:var(--font-display);font-size:17px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px;font-size:15px;align-content:start}
.kc b{font-family:var(--font-display);font-size:17px;font-stretch:104%}
.kc > span:not(.eyebrow){color:var(--ink-2)}
.chips,.chips-rows > div{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-rows{display:grid;gap:8px}
.chips-rows .eyebrow{min-width:96px}

<p>Las herramientas colaborativas <b>facilitan</b> el flujo y promueven encuentros que no ocurrirían en circunstancias normales. El e-book compara el flujo de conocimiento con la <b>circulación sanguínea</b> (lleva oxígeno a todas las áreas) y con un <b>combustible</b> que enciende el motor de la innovación.</p>

<h3>Capitalizar el tácito <span class="art">p. 32–33</span></h3>
<p>En GC, <b>capitalização</b> no es dinero: es dar valor y aprovechar al máximo el <b>conocimiento tácito</b>. Polanyi (1966): "conocemos más de lo que podemos <i>contar</i>". El desafío es capturarlo: para Nonaka e Takeuchi se vuelve explícito por <b>externalização</b> (articular y reflexionar sobre experiencias). Ayudan workshops, brainstormings y grupos de discusión: los <b>espaços de conhecimento</b>.</p>

<h3>Competitividad: diferenciación <span class="art">p. 33–34</span></h3>
<div class="sides">
  <div class="side"><span class="eyebrow">Estrategia</span><b>Diferenciação</b><p>Porter (1989): una de las <b>3 estrategias genéricas</b>. Productos percibidos como únicos → <b>preços premium</b> y márgenes más altos.</p></div>
  <div class="side-link" aria-hidden="true"><span>la impulsa</span></div>
  <div class="side"><span class="eyebrow">Fuente</span><b>Conhecimento tácito e explícito</b><p>Transformado en innovación, crea <b>barreras contra la imitación</b>: las competencias del tácito son difíciles de replicar (Prahalad e Hamel, 1990).</p></div>
</div>
<p>Zarifian (2001): lo que define a las organizaciones de alto desempeño en el siglo XXI es la capacidad de <b>aprender y evolucionar continuamente</b>, anticipando tendencias.</p>
<div class="box trap"><b class="box-h">Pegadinha</b><p>Si una alternativa dice que la GC "facilita que los competidores repliquen" las competencias, es falsa: la GC busca justamente lo contrario, una diferenciación <b>difícil de copiar</b>.</p></div>

<h3>Eficiencia operacional <span class="art">p. 34–36</span></h3>
<p>Terra (2001): con acceso rápido a informaciones y buenas prácticas se evita <b>rehacer tareas, cometer o repetir errores y desperdicios</b>. Sveiby (1998): la eficiencia también es <b>innovar procesos</b>, adaptarse y anticipar tendencias, donde el tácito pesa mucho.</p>
<p><b>Redundancias</b> = ineficiencia: repetición de tareas, sobrecarga de información, actividades que no agregan valor. Davenport e Prusak (1998): el conocimiento <b>crece</b> cuando se comparte, pero compartir de forma <b>excesiva o desorganizada</b> genera redundancia y confusión.</p>
<div class="two">
  <div class="kc"><b>Repositórios de conhecimento</b><span>Agrupan informaciones, buenas prácticas y aprendizajes de forma estructurada. Bien gestionados evitan la <b>duplicidad de esfuerzos</b> (Terra, 2001).</span></div>
  <div class="kc"><b>Comunicação e colaboração</b><span>La comunicación eficaz entre departamentos evita <b>tareas similares en paralelo</b>, típicas de organizaciones con baja integración (Carvalho e Ferreira, 2001).</span></div>
</div>

<h3>Toma de decisión <span class="art">p. 36–39</span></h3>
<p>Mintzberg (2000): decidir es un <b>proceso continuo</b> que une análisis sistemático de datos (explícito) e intuición de experiencias anteriores (tácito). Davenport e Harris (2007): las organizaciones <b>orientadas por analytics</b> combinan datos con las habilidades de decisión de sus líderes. Sveiby (1998): la experiencia da <b>contexto</b> a los datos.</p>

<p>Las tres <b>complementan</b> la capacidad humana de juicio: la sabiduría para interpretar y actuar sigue en los profesionales.</p>

<h3>Cultura organizacional <span class="art">p. 39–41</span></h3>
<p>Schein (2009): cultura = conjunto de <b>valores, crenças e práticas compartilhadas</b>; la "<b>cola</b>" que mantiene unida la organización. Terra (2001): la GC exitosa depende de una cultura que valore el aprendizaje, incentive el intercambio y <b>reconozca a quien contribuye</b>. A su vez, la GC fortalece la cultura. Por eso la relación es <mark>bidirecional e simbiótica</mark>: un ciclo virtuoso.</p>
<p><b>Senge (2004)</b>: organizações que aprendem son las capaces de <b>criar, adquirir e transferir</b> conocimiento y <b>modificar seus comportamentos</b> para reflejar nuevos insights. El aprendizaje es parte de la rutina, no un evento anual. Fleury e Fleury (2004): colaboradores dispuestos a <b>aprender y reaprender</b>. Requiere entrenamiento, plataformas y un ambiente que estimule <b>curiosidade, experimentação e compartilhamento</b>.</p>
<div class="box trap"><b class="box-h">Pegadinha</b><p>En este material Senge es <b>2004</b> (<i>A quinta disciplina</i>, BestSeller), no 1990. Si una alternativa usa otro año, desconfía.</p></div>

<p class="lead">En un mar de datos, la tarea difícil no es adquirir conocimiento, sino <mark>seleccionar lo que realmente vale</mark> e integrarlo a la organización. Este capítulo responde tres preguntas: ¿qué hace relevante un conocimiento?, ¿con qué mecanismos y herramientas se selecciona?, ¿cómo se integra al ecossistema organizacional?</p>

<h3>Relevância <span class="art">p. 47–48</span></h3>
<p>La relevancia es la "lente" que filtra la avalancha de datos. Oliveira e Ambrósio (2005): está ligada al <b>potencial de crear valor</b>; no es solo lo nuevo, sino lo <b>aplicable</b> a los objetivos estratégicos. No es estática: es <b>contextual</b> y cambia con el tiempo y las circunstancias. Drucker (1999): la sobrecarga de informaciones es un gran desafío, pero la <b>cantidad importa menos que la relevancia</b>.</p>

<h3>Alineación con la estrategia <span class="art">p. 49–50</span></h3>
<p>La estrategia organizacional define la <b>dirección y los objetivos generales</b>: es el mapa que guía decisiones y asigna recursos (Mintzberg et al., 2000). El conocimiento alineado a ella actúa como <b>acelerador</b>; según Terra (2001), esas organizaciones son <b>más ágiles, adaptables</b> y responden rápido a los cambios. Ejemplo: una empresa que quiere ir a mercados internacionales necesita <b>no solo informaciones</b>, sino conocimiento: comprensiones profundas, experiencias previas, lecciones aprendidas (Dutra, 2002). "No se trata de saber por saber".</p>
<div class="box trap"><b class="box-h">Pegadinha</b><p>Estrategia <b>no</b> es "solo objetivos inmediatos": es dirección y objetivos <b>generales</b>. Y el ejemplo internacional dice "no apenas informações, mas conhecimento": si una alternativa dice que bastan las informaciones, es falsa.</p></div>

<h3>Lacunas, atualidade e aplicabilidade <span class="art">p. 50–53</span></h3>
<p><b>Lacunas</b> = áreas donde el conocimiento falta o es insuficiente: riesgos y también oportunidades (Nonaka e Takeuchi, 1997). Muchas veces no son obvias, así que hay que buscarlas de forma <b>proactiva</b> (Terra e Gordon, 2002): evaluar competencias frente al mercado, <b>feedback de clientes</b> y <b>análisis competitivos</b> (Dutra, 2004). Senge (2004): ambiente donde se pueda decir "no sé" sin miedo.</p>
<div class="sides">
  <div class="side"><span class="eyebrow">¿Está vigente?</span><b>Atualidade</b><p>"Frescura" y relevancia en el contexto actual. En TI o Medicina lo de punta hace años hoy puede estar superado (Rezende, 2002). Actualizarse es una necesidad continua.</p></div>
  <div class="side-link" aria-hidden="true"><span>y además</span></div>

</div>
<p>Para garantizar ambas: revisiones sistemáticas, entrenamientos recurrentes y feedback de equipos multidisciplinarios (Davenport e Prusak, 1998).</p>

<h3>Los 3 mecanismos de seleção <span class="art">p. 53–54</span></h3>
<p>Por los mecanismos la organización <b>identifica, prioriza y moviliza</b> los recursos de conocimiento más adecuados (Von Krogh, 1998). Son una especie de <b>brújula</b> (Davenport e Prusak, 1998).</p>
<div class="three">
  <div class="col c-a"><span class="stamp">Mapear</span><b>Auditoria de conhecimento</b><p>Mapea el conocimiento existente, tácito o explícito, individual o colectivo; muestra activos y <b>lacunas</b>. Da un panorama claro <span class="art">Dutra, 2004</span>.</p></div>
  <div class="col c-b"><span class="stamp">Priorizar</span><b>Matrizes de conhecimento</b><p>Cruzan áreas de conocimiento con competencias, procesos o estrategias; muestran qué es crítico y qué desarrollar o adquirir afuera <span class="art">Terra, 2001</span>.</p></div>
  <div class="col c-c"><span class="stamp">Cocrear</span><b>Workshops de conhecimento</b><p>Grupos <b>multidisciplinarios</b> discuten, debaten y seleccionan; también cocrean saberes <span class="art">Nonaka e Takeuchi, 1997</span>.</p></div>
</div>
<p>La tecnología potencia, pero la esencia de la selección está en el <b>discernimiento humano</b>.</p>

<h3>Ferramentas tecnológicas <span class="art">p. 54–56</span></h3>

<h3>Los 5 critérios para elegir <span class="art">p. 56–57</span></h3>
<p>Santos (2003): la clave <b>no</b> es adoptar la herramienta más avanzada, sino la que se alinea a las necesidades y objetivos.</p>

  <div class="pc"><div class="pc-h"><b>2. Flexibilidade e escalabilidade</b><span class="art">Dutra, 2004</span></div><p>La herramienta debe evolucionar con la organización.</p></div>
  <div class="pc"><div class="pc-h"><b>3. Integração</b><span class="art">Valentim, 2002</span></div><p>Con ERP, CRM y plataformas de colaboración: optimiza procesos y evita redundancias.</p></div>
  <div class="pc"><div class="pc-h"><b>4. ROI</b><span class="art">Terra e Gordon, 2002</span></div><p>Costos iniciales <b>y</b> beneficios a largo plazo: ahorro de tiempo, productividad, ventaja competitiva.</p></div>
  <div class="pc"><div class="pc-h"><b>5. Fator humano</b><span class="art">Davenport e Prusak, 1998</span></div><p>"Talvez o mais importante": intuitiva, que genere engajamiento y alineada a la cultura.</p></div>
</div>

<h3>Integración al ecossistema organizacional <span class="art">p. 58–62</span></h3>
<p>Integrar es el proceso por el cual el conocimiento es <b>adquirido, adaptado, compartilhado e aplicado</b>; es continuo y cíclico (Nonaka e Takeuchi, 1997). Cada organización tiene un ecosistema único, formado por su <b>cultura, história, valores e pessoas</b>, que pide un abordaje personalizado: paciencia, estrategia y, sobre todo, <b>empatía</b> (Terra e Gordon, 2002).</p>
<p>Fleury e Fleury (2004): el ecossistema es el conjunto de características que determina cómo la organización <b>aprende, se adapta y evoluciona</b>. Sus componentes:</p>
<div class="grid4">
  <div class="kc"><b>Cultura organizacional</b><span>Crenças, normas e valores compartidos; el "<b>DNA</b>" de la empresa (Schein, 2009).</span></div>
  <div class="kc"><b>Estrutura organizacional</b><span>Arreglo formal de funciones, pero también las <b>redes de colaboración informal</b> (Mintzberg, 1995).</span></div>
  <div class="kc"><b>Processos organizacionais</b><span>Canales para disseminar, aplicar y crear conocimiento (Terra e Gordon, 2002).</span></div>
  <div class="kc"><b>Pessoas</b><span>El elemento más vital: "<b>ativos de conhecimento</b>", no meros ejecutores (Drucker, 1999).</span></div>
</div>

<h4>Métodos de integração <span class="art">p. 60–61</span></h4>

</div>
<h4>Desafíos y soluciones <span class="art">p. 61–62</span></h4>
<div class="migr">
  <div class="mg-row"><div class="mg-old"><span class="chip">Resistência à mudança</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>Programas de comunicação e engajamento</b><span>Involucrar a todos desde el inicio (Nonaka e Takeuchi). El desafío: Lewin (1951); amenaza al status quo (Probst, Raub e Romhardt, 2002).</span></div></div>

<p><b>Mensuração</b> (visión panorámica y objetiva): KPIs que, según Kaplan e Norton (1997), abarcan perspectivas financieras, de procesos internos, aprendizaje y crecimiento. <b>Feedback</b> (matices y profundidad): no solo evalúa el pasado, orienta las acciones futuras (Santos, 2000). Juntos: ciclo virtuoso (Terra, 2001).</p>

    'Captura del <b>tácito</b>: storytelling (contextos, <b>emoções</b> y matices) · mentoria (experto + menos experto) · comunidades de prática (interés común, se reúnen <b>regularmente</b>) · mapping (entrevistas, questionários) · debriefing (revisar <b>después</b> de concluir).',
    'Captura del <b>explícito</b>: repositórios y bases de dados · documentação · sistemas de GC · mapeamento · feedback. Entrevistas y workshops → tácito; plataformas y bases → explícito (Santos, 2010).',
    '<b>Repositórios</b>: sistemas centralizados o distribuidos que <b>preservam</b> (no se pierde con la salida de empleados) y permiten <b>localizar</b> rápido, reduciendo la duplicación.',
    '<b>CMS</b> descentraliza la creación de contenido (gestiona sites, intranets, portales, LMS). <b>KMS</b> conecta pessoas↔pessoas y pessoas↔informação (fóruns, wikis, blogs, recomendação); su desafío es <b>garantizar el uso</b>.',
    'Calidad = <b>precisão</b> (Wang e Strong) · <b>atualidade</b> (Alavi e Leidner) · <b>relevância</b> (Bollinger e Smith) · <b>clareza</b> (Davenport e Prusak) · <b>completude</b> (Rowley, 2007).',

  ],
  body: `
<p class="lead">El conocimiento vale si se puede <b>acceder</b> a él y usarlo. Por eso la <mark>captura</mark> es una etapa crítica: permite compartirlo, reutilizarlo y transformarlo. Después hay que <b>almacenarlo</b> en la plataforma adecuada y cuidar su <b>calidad y accesibilidad</b>.</p>

<h3>Por qué capturar <span class="art">p. 64–66</span></h3>
<p>Davenport e Prusak (1998) muestran que el conocimiento es <b>dinámico y muchas veces efímero</b>. Nonaka e Takeuchi (1997): el tácito debe convertirse en explícito (documentado y sistematizado) para diseminarse; la innovación ocurre en una <b>espiral continua</b> de conversiones tácito ↔ explícito. El reto no es solo guardar el explícito, sino acceder al enorme reservatorio de tácito de la fuerza de trabajo.</p>
<div class="box trap"><b class="box-h">Pegadinha</b><p>La misma definición de Davenport e Prusak aparece dos veces con palabras distintas: "mistura <b>fluida</b> … insight <b>experimentado</b>" (p. 29) y "mistura <b>fluente</b> … insights <b>especializados</b>" (p. 64). Es la misma idea.</p></div>

<h3>Técnicas de captura del tácito <span class="art">p. 66–67</span></h3>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Storytelling (narrativa)</b><span class="art">p. 66</span></div><p>Colaboradores comparten experiencias, historias y lecciones. Transmite no solo hechos, sino <b>contextos, emociones y matices</b> que se pierden en formatos formales. Una de las más reconocidas.</p></div>
  <div class="pc"><div class="pc-h"><b>Mentoria</b><span class="art">p. 66</span></div><p>Colaboradores <b>más experientes emparejados</b> con menos experientes: transferencia directa por diálogos e interacciones continuas.</p></div>
  <div class="pc"><div class="pc-h"><b>Comunidades de prática</b><span class="art">p. 67</span></div><p>Grupos con un <b>interés común</b> en un dominio, que se reúnen <b>regularmente</b> para aprender juntos.</p></div>
  <div class="pc"><div class="pc-h"><b>Mapping do conhecimento</b><span class="art">p. 67</span></div><p>Identifica dónde reside el tácito, usando <b>entrevistas o questionários</b> para saber quién tiene expertise.</p></div>
  <div class="pc"><div class="pc-h"><b>Debriefing</b><span class="art">p. 67</span></div><p>Revisar proyectos o tareas <b>después de concluirlos</b> con preguntas reflexivas, para capturar lecciones aprendidas.</p></div>
</div>
<p>Funcionan integradas y adaptadas a la cultura, que debe valorar el compartir. El resumen del capítulo agrega: capturar el tácito exige <b>aproximação, diálogo e confiança</b>.</p>
<div class="box trap"><b class="box-h">Pegadinha</b><p>"El storytelling transmite solo hechos" es falso: incluye <b>emociones</b>. "Comunidades de prática son temporales o de un solo proyecto" es falso: se reúnen <b>regularmente</b> por interés común.</p></div>

<h3>Técnicas de captura del explícito <span class="art">p. 68–70</span></h3>
<div class="grid4">
  <div class="kc"><b>Repositórios e bases de dados</b><span>Almacenan y categorizan para acceso fácil; las bases guardan grandes volúmenes analizables rápido (Sveiby, 1998).</span></div>
  <div class="kc"><b>Documentação</b><span>Procedimientos, políticas, manuales: bien estructurados son fuente valiosa (Nonaka e Takeuchi, 1997).</span></div>
  <div class="kc"><b>Sistemas de GC</b><span>Coletan, organizan y distribuyen información de forma eficiente.</span></div>
  <div class="kc"><b>Mapeamento do conhecimento</b><span>Representación visual: dónde está, quién lo tiene y cómo fluye.</span></div>
  <div class="kc"><b>Feedback</b><span>Validar, corregir o complementar lo existente (Probst, Raub e Romhardt, 2002).</span></div>
</div>
<div class="sides">
  <div class="side"><span class="eyebrow">Para el tácito</span><b>Entrevistas e workshops</b><p>Excelentes para capturarlo (Santos, 2010).</p></div>
  <div class="side-link" aria-hidden="true"><span>integração de métodos</span></div>
  <div class="side"><span class="eyebrow">Para el explícito</span><b>Plataformas digitais e bases de dados</b><p>Más eficientes (Santos, 2010).</p></div>
</div>
<p>Integrar métodos es una <b>necesidad</b>, no una tendencia (Terra, 2001): reduce lacunas y redundancias y potencia la creación de valor (Valentim, 2002). Los métodos <b>no son mutuamente excluyentes</b>.</p>
<div data-widget="classify" data-key="u1-captura"></div>
<div class="box trap"><b class="box-h">Pegadinha</b><p>"Mapeamento" tiene 4 papeles en el e-book: práctica de procesos (p. 24), captura del tácito con entrevistas (p. 67), captura del explícito como representación visual (p. 68) y "mapas de conhecimento" para seleccionar (p. 56). Pero "<b>mapeamento de emoções</b>" no existe: es distractor.</p></div>

<h3>Repositórios de conhecimento <span class="art">p. 70–72</span></h3>
<p>Desde la invención de la escritura se registra el saber (Santos, 2018). Los repositorios son <b>sistemas centralizados o distribuidos</b> donde el conocimiento se almacena, categoriza y queda accesible para reutilizar. Son como grandes bibliotecas digitales, pero guardan desde documentos y procedimientos hasta <b>videos, audios y simulaciones interactivas</b>.</p>
<div class="three">
  <div class="col c-a"><span class="stamp">Preservar</span><b>Preservação</b><p>Los insights no se pierden con el tiempo ni con la <b>salida de funcionarios experimentados</b>.</p></div>
  <div class="col c-b"><span class="stamp">Localizar</span><b>Busca avançada</b><p>Encontrar rápido lo que se necesita: eficiencia y menos duplicación de esfuerzos.</p></div>
  <div class="col c-c"><span class="stamp">Disseminar</span><b>Equipes dispersas</b><p>Una fuente centralizada mantiene alineados a equipos distribuidos geográficamente.</p></div>
</div>
<p>Pero implementarlo <b>no garantiza el éxito</b>: debe alinearse a la cultura y tener gestión constante del contenido.</p>

<h3>CMS, KMS, plataformas de colaboração y redes sociais <span class="art">p. 72–77</span></h3>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th></th><th>CMS</th><th>KMS</th><th>Plataformas de colaboração</th><th>Redes sociais corporativas</th></tr></thead>
  <tbody>
    <tr><th>Qué es</th><td>Content Management System: crear, gestionar y optimizar contenidos de forma estructurada.</td><td>Knowledge Management System: gestionar y aprovechar el <b>capital intelectual</b>; tácito → explícito.</td><td>Conjunto de herramientas integradas.</td><td>Foco principal en la <b>comunicación</b>.</td></tr>
    <tr><th>Rasgo clave</th><td><b>Descentraliza</b> la creación de contenido (antes era tarea de TI); <b>personalización</b>, extensiones y plugins.</td><td>Conecta <b>pessoas com pessoas</b> y <b>pessoas com informações</b>: fóruns, wikis, blogs corporativos, sistemas de recomendação.</td><td>Crear, editar y compartir documentos, gestionar proyectos, videoconferencias.</td><td>Discutir ideas, compartir novedades, conectarse entre áreas; intercambio <b>informal</b>.</td></tr>
    <tr><th>Ejemplos</th><td>Sites, intranets, portales, <b>LMS</b></td><td>Sousa e Rodrigues (2016): "ecossistemas de aprendizado"</td><td><b>SharePoint, Google Workspace</b> (Oliveira e Santos, 2019)</td><td><b>Yammer, Slack</b> (Barbosa e Silveira, 2018)</td></tr>
    <tr><th>Cuidado</th><td>Depende de implementación: planificación y entrenamiento.</td><td>Desafío: <b>garantizar el uso</b>; miedo a perder <b>poder o status</b> (Freitas e Costa, 2017).</td><td colspan="2">Adoptarlas no garantiza resultados: hace falta mudança cultural y líderes como modelo (Almeida e Lima, 2020).</td></tr>
  </tbody>
</table></div>
<p>Beneficios del KMS: <b>reutilización</b> del conocimiento, menos esfuerzos redundantes, cultura de compartir. Martins e Batista (2018): promueve la <b>cooperación</b> y es catalizador de innovación. Silveira e Lopes (2019): la liderança patrocina y <b>da el ejemplo</b>; tecnología, procesos y cultura alineados.</p>
<div data-widget="classify" data-key="u1-plataformas"></div>
<div class="box trap"><b class="box-h">Pegadinha</b><p>No confundas: <b>CMS descentraliza la creación de contenido</b>; <b>KMS conecta personas</b> y recomienda especialistas. Si la pregunta habla de fóruns, wikis, blogs y recomendação, es KMS.</p></div>

<h3>Calidad del conocimiento almacenado <span class="art">p. 78–80</span></h3>
<p>Sin calidad, el conocimiento puede volverse obsoleto, engañoso o perjudicial (Garvin, 1993); información desactualizada o imprecisa lleva a malas decisiones (Nonaka e Takeuchi, 1997). Toca cada dimensión:</p>
<div data-widget="terms" data-key="u1-def-qualidade"></div>
<div class="acro">
  <div><b>P</b><span><b>Precisão</b>: sin errores ni desinformación (Wang e Strong, 1996).</span></div>
  <div><b>A</b><span><b>Atualidade</b>: refleja cambios del ambiente externo e interno (Alavi e Leidner, 2001).</span></div>
  <div><b>R</b><span><b>Relevância</b>: alineada a necesidades, objetivos y estrategia (Bollinger e Smith, 2001).</span></div>
  <div><b>C</b><span><b>Clareza</b>: claro y comprensible (Davenport e Prusak, 1998).</span></div>
  <div><b>C</b><span><b>Completude</b>: cubre todos los aspectos relevantes (Rowley, 2007).</span></div>
</div>
<div class="box trap"><b class="box-h">Pegadinha</b><p>La primera frase del e-book (p. 78) lista solo 4: precisão, atualidade, relevância e clareza. La <b>completude</b> aparece en la p. 80. Son <b>5</b>. Y calidad no es volumen: "nem toda informação é valiosa".</p></div>

<h3>Acessibilidade <span class="art">p. 78–81</span></h3>
<p>Va más allá de la mera disponibilidad: es la facilidad con que los stakeholders pueden <b>localizar, compreender e aplicar</b> lo almacenado (Davenport e Prusak, 1998). Terra (2001): una organización aprendiz no solo crea y almacena, también <b>distribuye</b> y hace accesible el conocimiento a todos.</p>
<div class="chips-rows">
  <div><span class="eyebrow">Buscar</span><span class="chip">Pesquisa avançada <small>Nonaka e Takeuchi</small></span></div>
  <div><span class="eyebrow">Usar</span><span class="chip">Design e usabilidade <small>Sveiby</small></span><span class="chip">Personalização: notificações, dashboards <small>Terra e Gordon</small></span></div>
  <div><span class="eyebrow">Llegar</span><span class="chip">Acesso móvel <small>Santos e Steil, 2003</small></span><span class="chip">Formação e suporte <small>Leonard e Swap, 2005</small></span></div>
</div>

<h3>Padronização y protocolos <span class="art">p. 81–82</span></h3>
<p>Sveiby (1998): padronizar prácticas y procesos es una de las formas más eficaces de compartir conocimiento.</p>
<div class="two">
  <div class="kc"><b>Padronização</b><span>En su esencia: directrices y normas para que tareas o procesos se hagan de forma <b>uniforme</b>; reduce ambigüedades (Davenport e Prusak, 1998).</span></div>
  <div class="kc"><b>Protocolos</b><span>Conjunto de reglas para <b>ordenar, categorizar y acceder</b> al conocimiento (Terra, 2001). Dan consistencia, menos errores y búsqueda más rápida.</span></div>
</div>
<div class="balance">
  <div class="pan"><span class="eyebrow">Un plato</span><b>Processos padronizados</b><p>Consistencia, menos errores, decisiones más ágiles.</p></div>
  <div class="pan"><span class="eyebrow">El otro plato</span><b>Flexibilidade</b><p>No limitar la creatividad ni la innovación.</p></div>
  <div class="fulcrum"><b>Equilíbrio</b><span>Leonard e Swap (2005)</span></div>
</div>

<h3>Desafíos y soluciones <span class="art">p. 82–83</span></h3>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th>Desafíos</th><th>Soluções propostas</th></tr></thead>
  <tbody>
    <tr><td><b>Desatualização</b>: el ambiente volátil vuelve obsoleto el conocimiento (Drucker, 1999).</td><td><b>Auditorias regulares</b> del repositorio para eliminar lo desactualizado o irrelevante (Terra, 2001).</td></tr>
    <tr><td><b>Inconsistências</b>: muchas fuentes → redundancias y datos conflictivos (Sveiby, 1998).</td><td><b>Mecanismos de feedback</b> sobre utilidad y relevancia (Nonaka e Takeuchi, 1997).</td></tr>
    <tr><td><b>Acessibilidade limitada</b>: sistemas desarticulados o mal implementados (Davenport e Prusak, 1998).</td><td><b>Treinamento e capacitação</b> en el uso de las plataformas (Leonard e Swap, 2005).</td></tr>
  </tbody>
</table></div>

<div class="box prova"><b class="box-h">Cayó en los ejercicios</b><p><b>U1 Q16</b>: correctas mentoria y debriefing. <b>U1 Q17</b>: NO es captura del explícito = "mapeamento de emoções". <b>U1 Q18</b>: repositórios → <b>preservar – localizar</b>. <b>U1 Q19</b>: asociar característica, recursos, beneficio y desafío del <b>KMS</b>. <b>U1 Q20</b>: V/F sobre las dimensiones de calidad (F – F – V – V). <b>U1 Q25</b>: <b>essência da padronização – protocolos</b>.</p></div>
`

  </ul>
</div>
<p>La diferencia no es solo semántica. Datos e informaciones se almacenan con facilidad; el conocimiento es <b>inherentemente humano</b>, ligado a la experiencia y a la cognición <span class="art">p. 12</span>.</p>

<h3>Tácito × explícito <span class="art">p. 12</span></h3>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th></th><th>Conhecimento tácito</th><th>Conhecimento explícito</th></tr></thead>
  <tbody>
    <tr><th>Qué es</th><td>Profundamente <b>personal</b>, difícil de formalizar; intuitivo y subjetivo</td><td>Articulado en <b>linguagem formal</b>; fácil de comunicar y compartir</td></tr>
    <tr><th>Ligado a</th><td>Experiencias, emociones y valores individuales</td><td>Lo que conseguimos "colocar no papel"</td></tr>
    <tr><th>Dónde está</th><td>En la persona</td><td>Livros, manuais, documentos, bancos de dados</td></tr>
    <tr><th>Ejemplo del e-book</th><td><mark>Andar de bicicleta</mark>: sabemos hacerlo, explicar el equilibrio y las sensaciones es complejo</td><td>Documentar la expertise de un colaborador experimentado para toda la organización</td></tr>
  </tbody>
</table></div>
<p>El desafío está en convertir tácito en explícito: la <b>"externalização"</b>. No es simple: exige herramientas, técnicas y, sobre todo, una cultura que valore compartir. La <b>interacción continua</b> entre tácito y explícito es lo que hace posible crear conocimiento nuevo.</p>

<h3>Los 4 componentes-chave <span class="art">p. 13</span></h3>
<div class="grid4">
  <div class="kc"><b>1. Criação</b><span>Identificar y <b>capturar</b> conocimiento nuevo: <b>interno</b> (experiencia de los colaboradores) o <b>externo</b> (estudos, pesquisas, benchmarking).</span></div>
  <div class="kc"><b>2. Armazenamento</b><span><b>Conservar y organizar</b> en bases de datos, repositórios, bibliotecas digitais. Un buen sistema también facilita recuperar y reutilizar.</span></div>
  <div class="kc"><b>3. Distribuição</b><span>La <b>ponte</b> que hace circular el conocimiento: plataformas colaborativas, intranets, redes sociais corporativas y treinamentos → aprendizaje colectivo.</span></div>
  <div class="kc"><b>4. Aplicação</b><span>El conocimiento solo se revela valioso cuando se pone en práctica: resolver problemas, tomar decisiones o innovar.</span></div>
</div>
<div class="box trap"><b class="box-h">Pegadinha</b><p>El material enumera las funciones del SGC de cuatro maneras: armazenar, disseminar, aplicar e criar (p. 9); criação, distribuição, armazenamento e aplicação (p. 10 y 13); coletar, armazenar, disseminar e gerir (resumen, p. 26); capturar, armazenar e disseminar (Desafio Colaborativo). Todas valen. Lo que <b>no</b> vale: decir que la criação es "conservar y organizar" (eso es armazenamento) o que solo usa fuentes internas.</p></div>

<h3>Implementação e integração <span class="art">p. 14–16</span></h3>
<p>No basta con tener un SGC. Bien <b>implementado</b>, marca la diferencia entre solo almacenar información y crear valor; <b>integrado</b>, se conecta a otras herramientas y da una visión unificada del conocimiento. Ejemplo del e-book: ventas accede rápido a lo que produce P&amp;D; marketing aprovecha las lecciones de atención al cliente. Implementarlo es "uma jornada estratégica que envolve várias etapas":</p>
<ol class="flow">
  <li><b>Diagnóstico organizacional</b><span>Punto de partida: necesidades de conocimiento, cultura existente, metas y objetivos.</span></li>
  <li><b>Desenho</b><span>Tecnologías apropiadas, procesos definidos, estructura del sistema.</span></li>
  <li><b>Desenvolvimento</b><span>Construir, testar y refinar; superar resistencias culturales o técnicas.</span></li>
  <li><b>Implementação</b><span>Lanzamiento: treinamento, promoción de la adopción, acompañamiento inicial.</span></li>
  <li><b>Avaliação</b><span>Continua: feedback, medición de resultados, mejoras.</span></li>
</ol>
<div data-widget="steps" data-key="u2-sgc-etapas"></div>

<h3>4 desafios de la implementação <span class="art">p. 17</span></h3>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Resistência cultural</b><span class="art">p. 17</span></div><p>Cultura enraizada de retener conocimiento, donde la información es vista como <b>poder</b>.</p></div>
  <div class="pc"><div class="pc-h"><b>Tecnologias inadequadas</b><span class="art">p. 17</span></div><p>Adoptar soluciones sin entender las necesidades reales → sistemas demasiado complejos o que no atienden la demanda.</p></div>
  <div class="pc"><div class="pc-h"><b>Engajamento dos funcionários</b><span class="art">p. 17</span></div><p>"Um SGC é tão eficaz quanto as pessoas que o utilizam." Si no ven valor o no reciben treinamento, la eficacia queda seriamente comprometida.</p></div>
  <div class="pc"><div class="pc-h"><b>Gestão inadequada de expectativas</b><span class="art">p. 17</span></div><p>Los líderes deben fijar expectativas realistas sobre lo que el SGC puede y no puede hacer, y comunicarlo a todos.</p></div>
</div>
<div class="box trap"><b class="box-h">Pegadinha del slide</b><p>El slide escribe "tecnologias <b>envolventes</b>"; el e-book dice tecnologias <b>inadequadas</b>. El slide también llama a los SGCs "obrigatórios" para los activos intangibles; el e-book dice <b>especializados</b>. Vale el e-book.</p></div>

<h3>Integración con otros sistemas <span class="art">p. 18</span></h3>
<div class="sides">
  <div class="side"><span class="eyebrow">El centro</span><b>SGC</b><p>Se conecta a diversas fuentes de información y conocimiento y facilita el acceso entre áreas.</p></div>
  <div class="side-link" aria-hidden="true"><span>integração</span></div>
  <div class="side"><span class="eyebrow">Sistemas empresariales</span><b>ERP · CRM · SCM</b><p>Planejamento dos Recursos da Empresa, Customer Relationship Management y Supply Chain Management: visión más holística de los procesos de negocio.</p></div>
</div>
<ul class="clean">
  <li><b>SGC + CRM:</b> ventas accede de inmediato a insights del pós-venda o del suporte técnico.</li>
  <li><b>SGC + intranet o plataformas colaborativas:</b> facilita crear <b>comunidades de prática</b>.</li>
  <li><b>Desafíos de integrar:</b> armonizar tecnologías, procesos y culturas; <b>segurança da informação</b> y <b>governança de dados</b>.</li>
</ul>

<h3>5 boas práticas <span class="art">p. 19</span></h3>
<ul class="clean">
  <li><b>Liderança ativa</b> y engajamento de la alta gestión: no solo apoyar, <b>participar</b> y servir de modelo.</li>
  <li><b>Cultura de compartilhamento:</b> "a tecnologia pode facilitar a gestão do conhecimento, mas é a cultura da empresa que a determina". Compartir se valora y se recompensa.</li>
  <li><b>Formação contínua:</b> el treinamento no termina tras la fase inicial.</li>
  <li><b>Avaliação e melhoria contínuas:</b> evaluaciones regulares, feedback y disposición a ajustar.</li>
  <li><b>Estudos de caso e benchmarking:</b> aprender de los éxitos (y de los fracasos) de otras empresas.</li>
</ul>

<h3>Mensuração: ¿el SGC agrega valor? <span class="art">p. 20–22</span></h3>
<p>Medir permite <b>identificar el retorno</b> de la inversión, <b>justificar inversiones futuras</b> y <b>ajustar estrategias</b>. No es solo financiero: también cuentan la colaboración entre equipos, la agilidad en las decisiones y la cultura de aprendizaje continuo. Medir ya es una práctica de GC: la organización aprende sobre sí misma.</p>
<p>Los <b>KPIs (Indicadores-Chave de Desempenho)</b> son "métricas pré-definidas" que funcionan como <b>bússolas</b>. El e-book trae cinco:</p>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th>KPI</th><th>Qué muestra</th></tr></thead>
  <tbody>
    <tr><th>Volume de acessos e contribuições</th><td>Frecuencia de uso y participación activa (uno de los más comunes)</td></tr>
    <tr><th>Tempo médio de busca de informações</th><td>Eficiencia: tiempo bajo = plataforma intuitiva e información bien organizada</td></tr>
    <tr><th>Satisfação do usuário</th><td>Vía pesquisas y feedbacks; señala mejoras posibles</td></tr>
    <tr><th>Retorno sobre investimento (ROI)</th><td>Valor financiero generado × inversión; crucial para la alta gestión</td></tr>
    <tr><th>Taxa de inovação e melhoria de processos</th><td>Impacto directo del SGC en innovación y eficiencia operativa</td></tr>
  </tbody>
</table></div>
<p>Los KPIs deben estar <b>alineados con los objetivos estratégicos</b> y ser relevantes para el contexto del SGC.</p>

<h3>Métodos quantitativos <span class="art">p. 23</span></h3>
<ul class="clean">
  <li><b>Estatística de uso:</b> accesos, documentos cargados, consultas; en series temporales muestran tendencias y patrones de uso.</li>
  <li><b>Conversão em ação:</b> ¿cuántas consultas terminaron en mejoras o innovaciones? Liga el uso a la acción efectiva.</li>
  <li><b>Benchmarking:</b> comparar con padrões da indústria o empresas similares.</li>
  <li><b>Financieros:</b> el ROI y también <b>VPL</b> (Valor Presente Líquido) y <b>payback</b> (tempo de retorno do investimento).</li>
  <li><b>Análise preditiva:</b> con Inteligência Artificial y Big Data, anticipar tendencias y necesidades de conocimiento.</li>
</ul>
<p>Siempre se interpretan a la luz del contexto: "os números, isoladamente, pouco dizem".</p>

<p>Cultura organizacional = "conjunto de valores, crenças, rituais e normas" que moldean comportamiento, interacciones y decisiones. La tecnología es solo un facilitador: la transformación viene del cambio de mentalidad. Si la cultura no favorece comunicación abierta, colaboración e innovación, hasta la mejor RSC tendrá impacto limitado.</p>
<ul class="clean">
  <li>Una empresa de <b>jerarquía estricta y comunicación solo vertical</b> encontrará resistencia, porque la RSC es "por natureza, <b>colaborativa e horizontal</b>".</li>
  <li>La RSC funciona mejor donde hay <b>confianza mutua</b>: la gente se anima a compartir ideas y dar feedback.</li>
  <li><b>Comprometimento da liderança:</b> líderes que usan y promueven la RSC sirven de modelo.</li>
</ul>
<p><mark>"A cultura organizacional é o solo no qual essa tecnologia deve ser plantada."</mark></p>

<h3>3 modelos de RSC <span class="art">p. 33–34</span></h3>
<div class="three">

  <div class="col c-b"><span class="stamp">Externas</span><b>Empresa ↔ stakeholders</b><p>Interacción con clientes, proveedores o socios.</p><ul class="clean"><li>Feedback</li><li>Inovação aberta</li><li>Relaciones duraderas</li></ul></div>
  <div class="col c-c"><span class="stamp">Híbridas</span><b>Combinan las dos</b><p>Versátiles: comunicación fluida entre departamentos + feedbacks y colaboraciones externas.</p><ul class="clean"><li>Innovación</li><li>Adaptabilidad</li></ul></div>
</div>
<p>No existe un enfoque único: la elección depende de la <b>naturaleza</b> de la organización, sus <b>objetivos</b> y la <b>cultura</b> existente.</p>

<h3>Benefícios × desafios <span class="art">p. 35–37</span></h3>
<p>El e-mail, aunque todavía útil, ya no basta para las necesidades dinámicas de colaboración; las RSCs permiten interacciones más fluidas e inmediatas. Las empresas las ven como "catalisadores de inovação, colaboração e engajamento".</p>

  <div class="pan"><span class="eyebrow">4 desafios</span><b>Lo que cuesta</b><p><b>Resistência à mudança</b> (curva de aprendizaje; beneficios mal comunicados) · <b>Segurança das informações</b> (violaciones de datos, amenazas externas) · <b>Integração com sistemas existentes</b> (desafío técnico) · <b>Adoção e uso contínuos</b> ("implementar é apenas metade da batalha").</p></div>

<h3>Disseminação: certo, certas, certo <span class="art">p. 67</span></h3>
<div data-widget="terms" data-key="u2-def-disseminacao"></div>
<p>El conocimiento está distribuido por toda la organización; para valer debe estar disponible en el <b>ponto de ação</b>. Confinado en silos o departamentos, pierde valor. La diseminación es una ponte que conecta saberes, promueve aprendizaje continuo y la <b>cocriação</b> de soluciones; las organizaciones que diseminan bien son más ágiles y adaptables.</p>

<h3>Disseminação y tomada de decisão <span class="art">p. 68–71</span></h3>
<p>La calidad de una decisión depende de la calidad del conocimiento disponible y de la capacidad de interpretarlo. Basar decisiones en el saber no es nuevo; lo que cambió es la <b>cantidad</b> de información y la <b>velocidad</b> con que se produce y circula. Decidir con base en conocimiento = <b>filtrar, interpretar y aplicar</b>; incluye insights, experiencias, expertise e intuición. El reto: volver explícito el tácito para usarlo.</p>
<p>Ejemplo del e-book: al lanzar un producto nuevo, la decisión sobre precio, marketing o canales de distribución <mark>no debe basarse solo en números</mark>, sino también en las experiencias previas del equipo, el feedback de clientes y la percepción de tendencias. Es un abordaje <b>holístico</b> que combina datos cuantitativos y cualitativos <span class="art">p. 68</span>.</p>

  <div class="side"><span class="eyebrow">Conhecimento explícito</span><b>Documentos y plataformas</b><p>Formal y estructurado: documentos, manuales o plataformas digitales.</p></div>
</div>
<p>Los canales van de reuniones presenciales, seminarios y workshops a intranets, sistemas de gestión del conocimiento y redes sociales corporativas. Y la diseminación <b>"não é uma via de mão única"</b>: el feedback refina el conocimiento, así que los canales deben permitir interactividad entre remetente y receptor <span class="art">p. 69–70</span>.</p>

<h3>Inovação: motor y combustível <span class="art">p. 72–76</span></h3>
<p>Innovar es buscar cambios, analizarlos y explorar sus oportunidades. Detrás está el conocimiento, que se transforma en innovaciones de <b>productos, procesos y hasta modelos de negocio</b>.</p>
<div class="sides">
  <div class="side"><span class="eyebrow">Motor</span><b>Inovação</b><p>Impulsa a la organización hacia nuevos horizontes; exige creatividad y visión.</p></div>
  <div class="side-link" aria-hidden="true"><span>sin combustible no anda</span></div>
  <div class="side"><span class="eyebrow">Combustível</span><b>Conhecimento</b><p>Da los insights y la comprensión que permiten implementar las ideas transformadoras.</p></div>
</div>
<ul class="clean">
  <li>La GC <b>no es un fin en sí misma</b>: es un medio para objetivos estratégicos, entre ellos la innovación.</li>
  <li>Compartir es <b>multiplicar</b> el conocimiento: las ideas se mejoran, refinan y combinan.</li>
  <li><span class="art">Von Krogh, 1998</span> la innovación emerge con frecuencia de <b>comunidades o grupos con cultura de compartilhamento aberto</b>, un "terreno fértil".</li>
  <li>Al compartir, el tácito se vuelve explícito; "é no conhecimento tácito que, comumente, reside a verdadeira inovação".</li>
  <li>Compartir es <b>condición esencial</b> para que la innovación florezca.</li>
  <li>La innovación es un proceso continuo que requiere <b>flujos constantes de información e insights</b>; diseminar es distribuir "insights e sabedoria".</li>
  <li><b>Open innovation:</b> buscar ideas y soluciones fuera de sus muros.</li>
</ul>
<p>Para innovar a escala: que el conocimiento fluya libremente, que la gente se sienta segura para compartir <b>fracasos y éxitos</b>, y canales apropiados. La tecnología (plataformas digitales, intranets, RSCs) conecta personas en tiempo real y a escala global.</p>
<p>"A cultura alimenta-se do estratégico no café da manhã" (p. 76): si la cultura no está alineada, la estrategia difícilmente da resultados. Una cultura de compartir requiere <b>liderança comprometida</b>, <b>políticas que reconozcan y recompensen</b> y <b>canales adecuados y accesibles</b> (plataformas de colaboración, RSCs, SGCs). <mark>La innovación no es fruto de un momento "eureca", sino de la conexión y la recombinación de conocimientos dispersos.</mark></p>

<div data-widget="terms" data-key="u3-def-ao"></div>
<p>El e-book repite la idea con otros verbos. En la <span class="art">p. 14</span>: proceso por el cual las organizaciones <b>adquirem, interpretam, transferem e retêm</b> conhecimento y lo usan para adaptarse y evolucionar. En la <span class="art">p. 57</span>: <b>criação, retenção e transferência</b> de conhecimientos. Las tres formulaciones son válidas.</p>

<h3>Origens e evolução <span class="art">p. 9–14</span></h3>
<p>Según <span class="art">Fleury, 1997</span> ("Aprendizagem e inovação organizacional: as experiências de Japão, Coréia e Brasil"), la trayectoria de la AO <b>no es lineal</b>: va de las primeras nociones de treinamento corporativo a las complejas estrategias de gestão do conhecimento del siglo XXI. Aprender es una necesidad humana milenaria; llevarlo a la organización es un fenómeno reciente, ligado a los cambios económicos, tecnológicos y sociales de los siglos XX y XXI.</p>
<ol class="tl">

  <li><span class="tl-y">Teóricos-chave</span><span>Senge (2004), Argyris e Schön (1978), Fiol e Shenhar: dan forma al campo. Además de eficiencia: eficacia, adaptabilidad y capacidad de reinventarse.</span></li>

  <li><span class="tl-y">Era digital · VUCA</span><span>Acceso democratizado y aprendizaje colaborativo en tiempo real; el conocimiento se vuelve commodity. <span class="art">Silva, 2017</span>: la transformação digital va más allá de adoptar tecnología; es una reconfiguración con el aprendizaje continuo como pieza clave.</span></li>
  <li><span class="tl-y">Ecossistemas</span><span><span class="art">Santos e Carvalho, 2019</span> ("Ecossistemas de inovação e Aprendizagem Organizacional"): el conocimiento fluye entre departamentos, equipos y fronteras organizacionales; en el siglo XXI <mark>aprender es sinónimo de compartilhar e colaborar</mark>.</span></li>
  <li class="tl-now"><span class="tl-y">Hoje</span><span><b>Sustentabilidade</b> y responsabilidade social corporativa <span class="art">Oliveira e Ambrósio, 2020</span>: la AO es "a bússola" hacia prácticas más sostenibles y éticas.</span></li>
</ol>
<p>En Brasil, el aprendizaje tradicional basado en <b>repetição e memorização</b> empezó a ser sustituido por <b>metodologias ativas</b> centradas en el aprendiz: contextualizado, interdisciplinario y, sobre todo, reflexivo <span class="art">p. 12</span>.</p>

<h3>Los teóricos que moldearon el campo <span class="art">p. 11</span></h3>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Senge</b><span class="art">2004</span></div><p>"A Quinta Disciplina": <b>cinco disciplinas</b> para organizaciones que quieren aprender e innovar de forma continua. Más que adquirir habilidades, cultivar una <b>mentalidade de aprendizado</b>.</p></div>
  <div class="pc"><div class="pc-h"><b>Argyris e Schön</b><span class="art">1978</span></div><p>Aprendizagem en <b>loop simples e duplo</b>: la importancia de la reflexión y de <b>questionar as suposições subjacentes</b> para una verdadera AO.</p></div>
  <div class="pc"><div class="pc-h"><b>Fiol e Shenhar</b><span class="art">Você sabia?</span></div><p>"Em terras brasileiras": investigaron el papel de la <b>cultura</b> y de la <b>liderança</b> en la AO, con contribuciones en el <b>contexto local</b>.</p><p class="muted">Cultura brasileña: flexible y adaptable, por eso <b>facilitadora</b>; pero tiene desafíos para <b>institucionalizar</b> los aprendizajes.</p></div>
</div>

<h3>Aprendizagem individual × organizacional <span class="art">p. 14–20</span></h3>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th></th><th>Individual</th><th>Organizacional</th></tr></thead>
  <tbody>
    <tr><th>Qué es</th><td>Proceso por el que una persona adquiere nuevos conocimientos, habilidades, atitudes o valores</td><td>Proceso por el que la organización <b>como um todo</b> absorbe nuevos conocimientos y competencias, adaptándose e innovando</td></tr>
    <tr><th>Ritmo</th><td>Más <b>imediata</b>; cada persona tiene ritmos, estilos y abordajes propios</td><td>Exige integrar, amplificar y dirigir lo individual hacia objetivos organizacionales</td></tr>
    <tr><th>Rasgos</th><td><b>Autodireção</b> e influencia del <b>contexto sociocultural</b></td><td>Convertir tácito en explícito <b>y viceversa</b>; detectar y corregir errores</td></tr>
    <tr><th>Se ve en</th><td>Desarrollo personal y mejora de habilidades específicas</td><td>Innovaciones, adaptación de procesos, nuevas tecnologías, revisión de estrategias, nuevos productos o servicios</td></tr>
  </tbody>
</table></div>
<p>La individual es un proceso continuo basado en la experiencia. El ciclo forma una espiral <span class="art">p. 15</span>:</p>
<ol class="flow">
  <li><b>Experienciar</b><span>El individuo interactúa con su ambiente.</span></li>
  <li><b>Refletir</b><span>Piensa sobre lo vivido.</span></li>
  <li><b>Conceituar</b><span>Saca una idea a partir de la reflexión.</span></li>
  <li><b>Aplicar</b><span>Adopta comportamientos nuevos o modifica los existentes.</span></li>
</ol>
<ul class="clean">
  <li><b>Autodireção</b>: el adulto tiende a asumir la responsabilidad de su propio aprendizaje: define objetivos, identifica recursos y evalúa su progreso.</li>
  <li><b>Contexto sociocultural</b>: no se aprende aislado; lo moldean las relaciones sociales, el lenguaje y la cultura.</li>
  <li>La individual <b>no garantiza por sí sola</b> la evolución de la organización: la "verdadeira magia" ocurre cuando el aprendizaje de cada miembro converge hacia un objetivo común.</li>
</ul>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Kim</b><span class="art">1993</span></div><p>"A Aprendizagem Organizacional: da teoria à prática": proceso multifacético de <b>detecção e correção de erros</b>. Se aprende al ver la diferencia entre metas esperadas y resultados alcanzados, y al corregir.</p></div>
  <div class="pc"><div class="pc-h"><b>Nonaka e Takeuchi</b><span class="art">1997</span></div><p>"Criação de conhecimento na empresa": tácito (pessoal e contextual) ↔ explícito (codificado e formalizado) por socialização, externalização, combinação e internalização. El conocimiento <b>nace en el nivel individual</b>.</p></div>
  <div class="pc"><div class="pc-h"><b>Schein</b><span class="art">2009</span></div><p>"Cultura organizacional e liderança": la cultura (valores, normas, prácticas) puede <b>facilitar ou inibir</b> el aprendizaje. Curiosidad, apertura al cambio y colaboración lo favorecen.</p></div>
</div>
<div class="sides">
  <div class="side"><span class="eyebrow">De abajo hacia arriba</span><b>Individual → organizacional</b><p>La individual es el <b>alicerce</b>: experiencias, insights y habilidades alimentan el "reservatório" de la empresa. Hace falta un mecanismo que lo difunda en prácticas, procesos y cultura.</p></div>
  <div class="side-link" aria-hidden="true"><span>dança contínua</span></div>
  <div class="side"><span class="eyebrow">De arriba hacia abajo</span><b>Organizacional → individual</b><p>La AO <b>molda e direciona</b> la individual: una "organização que aprende" crea sistemas y procesos, oportunidades de desarrollo, colaboración y una cultura que valora aprender.</p></div>
</div>
<p><b>Alinhamento</b> <span class="art">p. 19–20</span>: <span class="art">Fleury e Oliveira Jr., 2001</span> ligan la capacidad competitiva a articular y aplicar conocimientos individuales en favor de objetivos estratégicos colectivos. <span class="art">Sveiby, 1998</span>: cuando hay congruencia entre objetivos individuales y organizacionales se crea un <b>ciclo virtuoso</b> de aprendizaje e innovación. Requiere visión, misión y valores bien comunicados y <b>feedback constante</b> entre líderes y colaboradores.</p>

<h3>Los 5 componentes <span class="art">p. 21–22</span></h3>
<div class="grid4">
  <div class="kc"><b>Conhecimento</b><span>En el cerne de la AO. Tácito (intrínseco, por experiencia, difícil de comunicar) × explícito (codificado, estructurado, fácil de compartir). Desafío: la conversión continua (Nonaka e Takeuchi, 1997).</span></div>
  <div class="kc"><b>Sistemas e estruturas</b><span>Bancos de datos, plataformas de aprendizaje, SGC: capturar, almacenar y diseminar. Sin ellos el conocimiento se pierde o queda obsoleto.</span></div>
  <div class="kc"><b>Cultura</b><span>Mayor activo u obstáculo. Schein (2009): influye no solo en <b>o que</b> se aprende, sino en <b>como</b> se aprende. Abierta al error constructivo y a la experimentación = aprende más rápido.</span></div>
  <div class="kc"><b>Comunidades de prática</b><span>Wenger (1998): grupos que comparten una preocupación o pasión y aprenden a mejorar interactuando regularmente.</span></div>
  <div class="kc"><b>Liderança</b><span>Moldea la dirección del aprendizaje, fija prioridades y crea un ambiente que lo valora. Va más allá de gestionar personas: gestiona y dirige el conocimiento.</span></div>
</div>

<h3>Las 6 características y su autor <span class="art">p. 22–23</span></h3>
<p>Los componentes son "de qué está hecha" la AO; las características son "cómo se comporta" una organización aprendente. Cinco de las seis tienen autor y obra: <mark>es justo lo que se erró en la Q22</mark>.</p>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th>Característica</th><th>Autor y obra</th><th>Idea clave</th></tr></thead>
  <tbody>
    <tr><th>Adaptabilidade</th><td><b>Garvin (1993)</b>, "Construindo uma organização que aprende"</td><td>Versátiles; responden rápido a los cambios, con el aprendizaje como herramienta principal</td></tr>
    <tr><th>Antecipação</th><td><b>Nevis et al. (1995)</b>, "Diagnóstico organizacional: capacidades organizacionais e aprendizado"</td><td>Más que reaccionar, anticipan: buscan activamente señales y tendencias</td></tr>
    <tr><th>Integração</th><td><b>Prahalad e Hamel (1990)</b>, "A competência essencial da corporação"</td><td>No se confina a un departamento o nivel: colaboración entre diversas áreas y competencias</td></tr>
    <tr><th>Introspecção</th><td><b>Argyris e Schön (1978)</b>, "Aprendizagem Organizacional: uma teoria da ação perspectiva"</td><td>Evalúan y reevalúan prácticas; <i>double-loop learning</i>: corrigen y cuestionan las premisas del error</td></tr>
    <tr><th>Colaboração</th><td><b>Stata (1989)</b>, "Gestão organizacional e aprendizado"</td><td>El aprendizaje se intensifica cuando es <b>compartilhado</b>; ambientes de libre intercambio</td></tr>
    <tr><th>Continuidade</th><td><span class="muted">sin autor</span></td><td>Aprender no es evento puntual: forma parte del "DNA organizacional", no de iniciativas aisladas</td></tr>
  </tbody>
</table></div>
<p class="muted">Nevis et al. = Nevis, DiBella e Gould (1995), según las referencias del e-book.</p>
<div data-widget="classify" data-key="u3-caract-autor"></div>

<h3>Cómo se combinan componentes y características <span class="art">p. 23–24</span></h3>
<div class="migr">
  <div class="mg-row"><div class="mg-old"><span class="chip">Tácito e explícito</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>+ adaptabilidade</b><span>Sin adaptabilidad, el valor del conocimiento no se aprovecha del todo frente al cambio.</span></div></div>
  <div class="mg-row"><div class="mg-old"><span class="chip">Sistemas e estruturas</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>+ colaboração e continuidade</b><span>Stata (1989): la naturaleza colaborativa y continua hace que esos sistemas se usen de forma eficaz.</span></div></div>
  <div class="mg-row"><div class="mg-old"><span class="chip">Cultura</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>+ reflexão crítica</b><span>Argyris e Schön (1978): una cultura de double-loop incita a cuestionar y revisar las prácticas.</span></div></div>
  <div class="mg-row"><div class="mg-old"><span class="chip">Liderança e gestão</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>+ integração</b><span>Son los catalizadores que armonizan los aprendizajes en todos los niveles.</span></div></div>
</div>
<div data-widget="classify" data-key="u3-comp-carac"></div>

<div class="box trap"><b class="box-h">Pegadinha: componente × característica</b><p>El slide 9 pone la "liderança eficaz" entre las características. En el e-book la <b>liderança es componente</b>. Las características son 6: adaptabilidade, antecipação, integração, introspecção, colaboração y continuidade.</p></div>
<div class="box trap"><b class="box-h">Pegadinha: Stata × Prahalad e Hamel</b><p>Los dos suenan a "colaborar". <b>Prahalad e Hamel</b> = colaboración <b>entre áreas y competencias</b> (integração). <b>Stata</b> = el aprendizaje se intensifica cuando se <b>comparte</b> (colaboração).</p></div>
<div class="box trap"><b class="box-h">Pegadinha: los años</b><p>En el e-book: <b>Senge 2004</b> y <b>Argyris e Schön 1978</b>. El DOCX del Desafio Colaborativo cita Senge <b>2014</b> y Argyris e Schön <b>1996</b> (Organizational Learning II). En la prueba usa los años del e-book.</p></div>
<div class="box prova"><b class="box-h">Cayó en los ejercicios</b>
  <p><b>U3 Q01</b> (I–IV): taylorismo = trabajadores como peças de uma máquina; Argyris e Schön (1978) = loops; cultura brasileña facilitadora pero difícil de institucionalizar. Respuesta: Apenas I e III.</p>
  <p><b>U3 Q02</b> (lacunas): "Inovação – local". AO como chave para la adaptabilidade y la <b>inovação</b>; Fiol e Shenhar en el contexto <b>local</b>.</p>
  <p><b>U3 Q03</b> (V/F): V – V – F – F. Autodireção y contexto sociocultural, verdaderas; Nonaka e Takeuchi no es "apenas" tácito → explícito; una cultura resistente al cambio no promueve aprendizaje.</p>
  <p><b>U3 Q04</b>: AO = absorver, adaptar e inovar; no es solo la soma de las aprendizagens individuais.</p>
  <p><b>U3 Q05</b> (associação): tácito/explícito; Schein (o que <i>e como</i> se aprende); comunidades de prática (Wenger, 1998); liderança (direção, prioridades, ambiente).</p>
  <p><b>U3 Q21</b>: Santos e Carvalho (2019): compartilhamento e colaboração em ecossistemas. VUCA es solo el contexto.</p>
  <p><b>U3 Q22</b> (la que erraste): <b>1-b, 2-a, 3-d, 4-c</b>. Garvin = adaptabilidade; Nevis et al. = antecipação; Prahalad e Hamel = integração; Argyris e Schön = introspecção.</p>
</div>
<div class="box tech"><b class="box-h">Del Desafio Colaborativo</b><p>Tema: componentes y características en evolución (base: Senge). Respuesta-modelo: el componente más crucial en la era digital es el <b>pensamento sistêmico</b>, y la aprendizagem individual es la <b>base</b> de la organizacional. Ojo: en el e-book el pensamento sistêmico es una de las 5 disciplinas de Senge, no uno de los 5 componentes.</p></div>
<div class="box tech"><b class="box-h">No cayó todavía · puede caer</b><p>Fleury (1997): trayectoria no lineal · Terra (2001): gerar, distribuir e aplicar · Kim (1993): detectar y corregir errores · Schein: facilitar ou inibir · Sveiby (1998): ciclo virtuoso · Fleury e Oliveira Jr. (2001) · ciclo experienciar → refletir → conceituar → aplicar.</p></div>
`
});
