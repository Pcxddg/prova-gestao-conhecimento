<p class="lead">La <mark>melhoria contínua</mark> es un proceso sistemático que aumenta <b>gradualmente</b> la eficiencia y la eficacia de los procesos <span class="art">p. 26</span>. En vez de cambios grandes y caros, apuesta por <b>pequeñas innovaciones</b> que, con el tiempo, dan resultados significativos. Y la AO es su motor: <mark>aprender no es un evento aislado, es una cultura</mark>.</p>
<p>No es solo una técnica o una herramienta: es una <b>mentalidade</b>. Involucra a todos, de la alta gestión a los empleados de la línea de frente, "todos engajados no compromisso com o progresso constante" <span class="art">p. 27</span>.</p>

<h3>Los 4 elementos-chave: la "espinha dorsal" <span class="art">p. 27–28</span></h3>
<div class="grid4">
  <div class="kc"><b>Ciclo PDCA</b><span>Plan, Do, Check, Act. Estructura iterativa: planificar, ejecutar, verificar y actuar. Es cíclico: la mejora "nunca realmente termina".</span></div>
  <div class="kc"><b>Kaizen</b><span>Además de mejora continua, involucra a todos. Incentiva <b>pequeños equipos</b> que se reúnen regularmente para identificar ineficiencias y proponer soluciones, valorando el aporte de cada miembro.</span></div>
  <div class="kc"><b>Análise de Causa Raiz</b><span>Identificar y corregir las <b>causas subyacentes</b> de los problemas, en vez de tratar solo los síntomas.</span></div>
  <div class="kc"><b>Fluxo de Valor (Lean)</b><span>El mapeamento do Fluxo de Valor visualiza y optimiza procesos productivos: elimina desperdicios y crea más valor con menos recursos.</span></div>
</div>
<h4>El Ciclo PDCA de la Imagem 3.3</h4>
<div data-widget="steps" data-key="u3-pdca"></div>

<h3>Por qué la AO es central para la melhoria contínua <span class="art">p. 28–31</span></h3>
<p>Una "organização aprendente" se adapta, crece y aprende de forma continua. Por eso <mark>el aprendizaje no es un evento aislado, sino una cultura</mark>: la capacidad de <b>absorver</b> nuevas informaciones, <b>refletir</b> sobre ellas y <b>aplicar</b> cambios de acuerdo con ese conocimiento. "E isso, em sua essência, é a melhoria contínua." Para ser aprendente, la organización debe <b>criar, adquirir e transferir</b> conocimiento y <b>modificar su comportamiento</b>: la AO actúa como un <b>motor</b> hacia prácticas más eficientes e innovadoras. También fortalece la <b>resiliência</b>: aprender de errores y éxitos del pasado puede ser la diferencia entre prosperar o quedarse atrás.</p>
<div class="balance">
  <div class="pan"><span class="eyebrow">Un plato</span><b>Melhoria contínua</b><p>Aporta la <b>estructura y las herramientas</b> para optimizar e innovar.</p></div>
  <div class="pan"><span class="eyebrow">El otro plato</span><b>Aprendizagem organizacional</b><p>Alimenta ese sistema con <b>insights, reflexiones</b> y la capacidad de adaptarse y crecer.</p></div>
  <div class="fulcrum"><b>Dois lados da mesma moeda</b><span>Uno no funciona plenamente sin el otro: el aprendizaje alimenta la mejora y la mejora impulsa más aprendizaje.</span></div>
</div>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Nonaka e Takeuchi</b><span class="art">1997</span></div><p>El conocimiento transita entre tácito y explícito por socialização, externalização, combinação e internalização. El e-book llama a ese ciclo <b>"espiral do conhecimento"</b>. En cada etapa hay una oportunidad de mejora: al <b>socializar</b> ideas se identifican prácticas innovadoras; al <b>combinar</b> informaciones surgen nuevas soluciones.</p></div>
  <div class="pc"><div class="pc-h"><b>Bessant e Tidd</b><span class="art">2009</span></div><p>"Inovação e empreendedorismo": la capacidad de <b>innovar</b> (un pilar de la MC) está muy influida por la capacidad de <b>aprender</b>. La AO es "terreno fértil" para la innovación.</p></div>
</div>
<p>Beneficios de integrar los dos conceptos en el "DNA" de la organización <span class="art">p. 30–31</span>:</p>
<div class="two">
  <div class="kc"><b>Inovação</b><span><span class="art">Terra, 2001</span>: las empresas que integran aprendizaje y mejora se vuelven más ágiles y adaptables ante oportunidades y amenazas.</span></div>
  <div class="kc"><b>Resiliência</b><span><span class="art">Salerno, 1999</span>: las organizaciones aprendentes enfrentan adversidades y se recuperan, manteniendo o mejorando su performance.</span></div>
  <div class="kc"><b>Eficiência operacional</b><span><span class="art">Fleury e Fleury, 2003</span>: errores menos repetidos y mejores prácticas difundidas más rápido; menos desperdicio, más productividad.</span></div>
  <div class="kc"><b>Ambiente engajador</b><span>Se valoran las contribuciones individuales, se estimula el feedback y el desarrollo personal y profesional.</span></div>
</div>

<h3>La AO como catalisadora da inovação e da eficiência <span class="art">p. 31–35</span></h3>
<ul class="clean">
  <li><span class="art">Tidd e Bessant, 2011</span> ("Gestão da inovação"): la innovación exige una postura de <b>constante aprendizaje</b>; no es solo crear algo nuevo, sino aprender, adaptarse y aplicar.</li>
  <li><mark>La única fuente sostenible de ventaja competitiva</mark> es aprender y aplicar <b>más rápido que la competencia</b>.</li>
  <li><span class="art">Antunes e Martins, 2002</span>: la AO construye y reconstruye constantemente el saber; ese "novo saber" es fuente inagotable de innovación (experimentación, prueba y error).</li>
  <li><span class="art">Nonaka e Takeuchi, 1997</span>: la conversión tácito → explícito es un proceso central para la innovación.</li>
  <li><b>Ambidestria organizacional</b>: explorar las competencias actuales (<b>aprendiendo</b>) y, al mismo tiempo, nuevas oportunidades (<b>innovando</b>). Ese equilibrio refleja una fuerte cultura de AO.</li>
</ul>
<h4>Eficiencia: ciclo único × ciclo duplo <span class="art">p. 33</span></h4>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th></th><th>Aprendizagem de ciclo único</th><th>Aprendizagem de ciclo duplo</th></tr></thead>
  <tbody>
    <tr><th>Qué hace</th><td>Ajustes <b>dentro</b> del sistema de trabajo actual</td><td><b>Cuestiona y redefine</b> el propio sistema</td></tr>
    <tr><th>Para la eficiencia</th><td>Corrige sin tocar la base</td><td>Crucial: identifica fallas fundamentales y reformula los procesos por completo</td></tr>
  </tbody>
</table></div>
<p>Se suma la <b>mentalidade aberta e adaptável</b>: desafiar las propias creencias y prácticas para eliminar las obsoletas. La AO es una <b>via de mão dupla</b> para la eficiencia: ayuda a identificar áreas de mejora en los procesos actuales y permite adoptar innovaciones y mejores prácticas del sector más rápido.</p>
<h4>Cultura de aprendizagem + cultura de inovação <span class="art">p. 34</span></h4>
<div class="balance">
  <div class="pan"><span class="eyebrow">Cultura de aprendizagem</span><b>Exige humildade</b><p>Los miembros tienen una "compulsão insaciável" por adquirir y aplicar nuevos conocimientos; eso moldea cómo la empresa responde a los desafíos.</p></div>
  <div class="pan"><span class="eyebrow">Cultura de inovação</span><b>Requer coragem</b><p>Tidd e Bessant (2011): curiosidad, voluntad de explorar lo desconocido y coraje para desafiar el status quo. Ve el fracaso como oportunidad de aprendizaje.</p></div>
  <div class="fulcrum"><b>La gestión lidera con el ejemplo</b><span>Ambientes seguros para experimentar; incentivar curiosidad y cuestionamiento. Juntas, las ideas se generan, prueban, ajustan e implementan.</span></div>
</div>
<div data-widget="classify" data-key="u3-culturas"></div>
<h4>Los 4 desafíos <span class="art">p. 35</span></h4>
<div class="grid4">
  <div class="kc"><b>Resistência à mudança</b><span><span class="art">Morgan, 1996</span> ("Imagens da organização"): nos apegamos a patrones y rutinas; una cultura de valores y prácticas arraigadas es de los mayores obstáculos a la innovación.</span></div>
  <div class="kc"><b>Falta de espaços seguros</b><span><span class="art">Scharmer, 2009</span> ("Teoria U"): donde el error se castiga, la innovación es "inevitavelmente sufocada".</span></div>
  <div class="kc"><b>Gestão do conhecimento</b><span><span class="art">Terra, 2001</span>: faltan sistemas para capturar, almacenar y diseminar; esfuerzos duplicados y pérdida de insights.</span></div>
  <div class="kc"><b>Falta de liderança</b><span>Comprometida y visionaria: los líderes deben mostrar esos valores en sus acciones y decisiones diarias.</span></div>
</div>

<h3>Casos prácticos <span class="art">p. 36–39</span></h3>
<p><span class="art">Mintzberg, 2000</span> ("Safari de estratégia"): como el aprendizaje, la estrategia se forma <b>más por acciones que por planes formales</b>. <span class="art">Drucker, 1997</span>: lo que se mide puede administrarse; los estudios de caso ofrecen medidas concretas de las teorías en acción.</p>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>Toyota</b><span class="art">Liker, 2005</span></div><p>Ejemplo clásico de <b>Kaizen</b>: ciclos de feedback rápidos; los empleados identifican y comunican problemas, por menores que sean, para resolverlos en colaboración. Cultura de respeto al individuo y trabajo en equipo → paradigma de excelencia en manufactura.</p><p class="muted">Global · foco: melhoria contínua en procesos y operaciones.</p></div>
  <div class="pc"><div class="pc-h"><b>Google</b><span class="art">Bock, 2015</span></div><p>Proyectos experimentales, feedbacks constantes y compartir conocimiento. Los empleados dedican un <b>porcentaje de su tiempo a proyectos personales</b>, muchos de los cuales generan innovaciones.</p><p class="muted">Global · foco: inovação e experimentação.</p></div>
  <div class="pc"><div class="pc-h"><b>Natura</b><span class="art">Brasil</span></div><p>Compromiso con la innovación y la <b>sustentabilidade</b>. Apertura a la aprendizagem coletiva: <b>espaços colaborativos</b> e intercambio de conocimiento entre empleados y <b>parceiros</b>.</p><p class="muted">Nacional · foco: colaboração e sustentabilidade.</p></div>
  <div class="pc"><div class="pc-h"><b>Magazine Luiza</b><span class="art">Brasil</span></div><p>Foco en el <b>capital humano</b>. Programa <b>"Escola de Líderes"</b>: formación continua, cultura de aprendizaje y adaptabilidad ante cambios rápidos del mercado.</p><p class="muted">Nacional · foco: capital humano.</p></div>
</div>
<div data-widget="classify" data-key="u3-casos"></div>
<p>El e-book compara los casos en tres ejes:</p>
<ul class="clean">
  <li><b>Escopo e escala</b> <span class="art">Porter, 1985</span>: Toyota y Google operan en múltiples geografías (equipos diversos, complejidad intercultural); Natura y Magazine Luiza tienen fuerte identidad nacional. La escala cambia la velocidad y la forma de implementar.</li>
  <li><b>Cultura organizacional</b> <span class="art">Schein, 2009</span>: el "ethos" de cada empresa define cómo aprende (eficiencia, innovación, colaboración y sustentabilidad, capital humano).</li>
  <li><b>Abordagens de implementação</b> <span class="art">Nonaka e Takeuchi, 1997</span>: la AO no es lineal; lo común a todas es ver el aprendizaje como <b>inversión que rinde a largo plazo</b>.</li>

<p class="lead">La esencia de la comunicación organizacional <mark>no cambió: cambiaron las herramientas y los métodos</mark> <span class="art">Costa, 2005</span>. Hoy, comunicación y colaboración son <b>competências estratégicas</b>, no solo funciones operativas: pueden ser el diferencial entre el éxito y el fracaso en el mercado globalizado <span class="art">p. 42</span>.</p>

<h3>De los memorandos a la internet <span class="art">p. 41–42</span></h3>
<p>La historia de la comunicación organizacional es tan antigua como la del trabajo humano: desde los grupos de cazadores-recolectores hasta las corporaciones globales, comunicarse bien siempre fue clave para coordinar actividades colectivas.</p>
<div data-widget="steps" data-key="u3-evol-com"></div>

<h3>Por qué se volvieron indispensables <span class="art">p. 42–43</span></h3>
<ul class="clean">
  <li><b>Volumen de información</b> que crece exponencialmente: <mark>filtrar, distribuir y acceder</mark> a información relevante es una competencia vital. Las herramientas permiten compartir conocimiento, decidir en conjunto y gestionar proyectos de forma integrada <span class="art">Barbosa, 2010</span>.</li>
  <li><b>Trabajo remoto</b>: "realidade inegável". Equipos en distintos husos horarios y culturas exigen herramientas que <b>trasciendan barreras geográficas y temporales</b>; la colaboración en tiempo real mantiene la cohesión del equipo.</li>
  <li><b>Transforman la cultura</b>: más que facilitar la comunicación, promueven <b>transparencia, inclusión y participación activa</b> de todos, sin importar ubicación o posición jerárquica.</li>
</ul>

<h3>Las 4 categorías de la p. 43–44 <span class="art">Mendes, 2014</span></h3>
<div class="chips-rows">
  <div><span class="eyebrow">Videoconferência</span><span class="chip">Zoom</span><span class="chip">Teams</span><span class="chip">Skype</span></div>
  <div><span class="eyebrow">Gestão de projetos e tarefas</span><span class="chip">Trello</span><span class="chip">Asana</span><span class="chip">Monday</span></div>
  <div><span class="eyebrow">Compartilhamento de documentos</span><span class="chip">Google Drive</span><span class="chip">Dropbox</span><span class="chip">OneDrive</span></div>
  <div><span class="eyebrow">Comunicação instantânea</span><span class="chip">Slack</span><span class="chip">WhatsApp Business</span><span class="chip">Teams</span></div>
</div>
<div class="grid4">
  <div class="kc"><b>Videoconferência</b><span>Reuniones virtuales en tiempo real entre equipos distribuidos; experiencia "quase tão pessoal quanto presencial", sin desplazamientos ni gastos (Soares, 2016).</span></div>
  <div class="kc"><b>Gestão de projetos e tarefas</b><span>Organizar tareas, definir responsabilidades y seguir el progreso: qué hay que hacer, quién lo hace y hasta cuándo.</span></div>
  <div class="kc"><b>Compartilhamento de documentos</b><span>Almacenar, compartir y colaborar en documentos en tiempo real; clave para la continuidad del trabajo remoto.</span></div>
  <div class="kc"><b>Comunicação instantânea</b><span>Comunicación ágil: todos al tanto de actualizaciones y cambios rápidamente (Silva, 2017).</span></div>
</div>
<p>En la <span class="art">p. 47</span> el e-book vuelve a clasificar y agrega una quinta categoría: <b>design e brainstorming colaborativo</b> (<b>Figma</b> y <b>Miro</b>: cocrear y "brainstormar" de forma interactiva y simultánea). Ahí también: Zoom y Teams para reuniones, workshops y webinars; Slack o Microsoft Teams como chats corporativos; Trello, Asana y <b>Monday.com</b> para tareas, <b>milestones</b> y plazos; Google Drive, Dropbox y OneDrive como soluciones en nube (Silveira, 2020).</p>
<div data-widget="classify" data-key="u3-ferramentas"></div>

<h3>Integración entre herramientas <span class="art">p. 44–45</span></h3>
<p>La verdadera fuerza no está en cada herramienta aislada, sino en cómo se integran <span class="art">Rocha, 2016</span>:</p>
<div class="three">
  <div class="col c-a"><span class="stamp">Vantagem</span><b>Consistência da informação</b><p>La información fluye sin desinformación ni redundancia. Ej.: un documento del Google Drive que se actualiza solo en una tarea del Trello, y todos ven la misma versión.</p></div>
  <div class="col c-b"><span class="stamp">Vantagem</span><b>Eficiência operacional</b><p>Procesos de varias etapas se simplifican: menos tiempo en tareas administrativas, más en actividades de mayor valor.</p></div>
  <div class="col c-c"><span class="stamp">Vantagem</span><b>Visão estratégica</b><p>Los gestores ganan una visión holística de las operaciones y detectan oportunidades de mejora e innovación.</p></div>
</div>
<p>Pero integrar no es solo una cuestión técnica: exige objetivos de negocio claros, una cultura abierta al cambio y entrenamiento continuo <span class="art">Azevedo, 2017</span>.</p>

<h3>Herramientas modernas y sus funcionalidades <span class="art">p. 46–49</span></h3>
<p>Antes: reuniones presenciales, llamadas y e-mails. Con la transformação digital la colaboración se volvió dinámica y en tiempo real <span class="art">Freitas, 2019</span>. Las herramientas modernas no son simples evoluciones: son innovaciones para rapidez, integración de plataformas y seguridad de la información <span class="art">Barbosa, 2020</span>. Funcionalidades que hay que conocer <span class="art">Lima, 2022</span>:</p>
<div class="pcards">
  <div class="pc"><div class="pc-h"><b>IA e Machine Learning</b><span class="art">Souza, 2021</span></div><p>Chats corporativos que categorizan y priorizan mensajes o sugieren respuestas.</p></div>
  <div class="pc"><div class="pc-h"><b>RA e RV</b><span class="art">p. 48</span></div><p>Programas de videoconferencia que incorporan <b>Realidade Aumentada y Virtual</b>: <mark>reuniones inmersivas</mark> y colaboración más interactiva en proyectos de diseño.</p></div>
  <div class="pc"><div class="pc-h"><b>Automação e integração</b><span class="art">p. 48</span></div><p>Automatizar tareas repetitivas, integrar otros programas y personalizar flujos de trabajo.</p></div>
  <div class="pc"><div class="pc-h"><b>Análise de dados e insights</b><span class="art">p. 48</span></div><p>Datos sobre productividad del equipo, patrones de comunicación y eficiencia de proyectos para decidir.</p></div>
  <div class="pc"><div class="pc-h"><b>Segurança avançada</b><span class="art">Almeida, 2021</span></div><p>Criptografía de punta a punta, autenticación de dos factores y sistemas de backup robustos.</p></div>
</div>
<p>Las herramientas solas no garantizan colaboración: hay que integrarlas y adoptarlas bien. Los <b>5 desafíos</b> <span class="art">p. 49–50</span>:</p>
<ul class="clean">
  <li><b>Resistência à mudança</b>: el primero y más común; incomoda dejar los métodos tradicionales.</li>
  <li><b>Formação e capacitação</b>: sin entrenamiento, no se usa todo el potencial.</li>
  <li><b>Integração com sistemas existentes</b>: incompatibilidades y pérdida de eficiencia con sistemas antiguos.</li>
  <li><b>Questões de segurança</b>: pueden crear nuevos puntos de vulnerabilidad si no se gestionan.</li>
  <li><b>Custo de implementação</b>: inversión inicial en herramientas y formación; pesa sobre todo en empresas de menor porte.</li>
</ul>
<p>Las organizaciones con una cultura de aprendizaje continuo están mejor preparadas para enfrentarlos.</p>

<h3>Comunicação efetiva <span class="art">p. 50–51</span></h3>
<p>Ocurre cuando <mark>el mensaje del emisor es entendido e interpretado por el receptor exactamente como fue pretendido</mark>: sin ruidos, distorsiones ni malentendidos. <span class="art">Motta, 2012</span>: una falla de comunicación lleva a equívocos operativos, pérdida de productividad y hasta perjuicios financieros y estratégicos. Toca cada pilar:</p>
<div data-widget="terms" data-key="u3-pilares"></div>
<h4>Lo que las herramientas aportan a la comunicación <span class="art">p. 52–53</span></h4>
<div class="grid4">
  <div class="kc"><b>Imediaticidade</b><span>Intercambio en tiempo real, sin las barreras geográficas y temporales de antes.</span></div>
  <div class="kc"><b>Transparência</b><span>Registran discusiones, feedbacks y progreso de tareas; todos ven la misma información.</span></div>
  <div class="kc"><b>Tomada de decisão</b><span>Decisiones más rápidas e informadas, con menos errores y malentendidos.</span></div>
  <div class="kc"><b>Integração das equipes</b><span>Cohesión en equipos remotos; cultura organizacional unificada y colaborativa.</span></div>
</div>

<h3>Casos de éxito <span class="art">p. 53–54</span></h3>
<p>El éxito no depende solo de la tecnología, sino de cómo se incorpora a la cultura y a los procesos.</p>
<div class="sides">
  <div class="side"><span class="eyebrow">Gomes, 2018</span><b>TecInova</b><p>Adoptó una plataforma de gestión de proyectos y comunicación interna. Resistencia inicial de algunos colaboradores → <b>entrenamientos + campaña interna de sensibilización</b> → más adhesión, <mark>−30%</mark> en el tiempo de conclusión de proyectos y <mark>+20%</mark> en la satisfacción de los clientes.</p></div>
  <div class="side-link" aria-hidden="true"><span>cases de sucesso</span></div>
  <div class="side"><span class="eyebrow">Sin autor citado</span><b>AgroSustentável</b><p>Videoconferencia + colaboración en nube: optimizó la comunicación entre sus <b>filiales</b> y redujo costos con <b>desplazamientos e impresiones</b>.</p></div>
</div>
<p><b>Mejores prácticas</b> que explican esos resultados: entrenamiento continuo de los colaboradores; integrar las herramientas con otros sistemas, como <b>CRM</b> (Customer Relationship Management) y <b>ERP</b> (Enterprise Resource Planning); y recolectar y analizar constantemente el <b>feedback de los usuarios</b> para ajustar las herramientas.</p>

<p class="lead">Los modelos de AO son un <mark>"roteiro" para las empresas</mark>: dan una estructura para entender cómo las organizaciones <b>assimilam, compartilham e aplicam</b> conocimientos <span class="art">p. 56</span>. Aprender aquí no es solo adquirir: también es <b>redefinir y transformar</b> lo que ya se sabe. La AO involucra adquisición, diseminación y uso del conocimiento, y la capacidad de modificar el comportamiento con base en él.</p>

<div class="chips"><span class="chip">Por experiência</span><span class="chip">Por liderança</span><span class="chip">Ativa</span><span class="chip">Sistêmica</span><span class="chip">Por compartilhamento</span><span class="chip">Por grupo</span><span class="chip">Cultural</span></div>
<p>Hay modelos que enfocan aspectos <b>mecánicos y sistemáticos</b> del aprendizaje; otros se concentran en la <b>cultura</b>, las <b>relaciones interpersonales</b> o los <b>procesos cognitivos</b>.</p>

<p>En la realidad, las dos <mark>no son mutuamente excluyentes</mark>: coexisten y son interdependientes. La organización exitosa armoniza ambas: lo individual se vuelve valor colectivo y lo colectivo retroalimenta e inspira al individuo.</p>

<p>Estos modelos clásicos siguen siendo referencias esenciales y base de nuevas teorías.</p>

<p>Responden a los desafíos actuales: <b>digitalização</b>, <b>globalização</b> y necesidad de <b>rápida adaptação</b>.</p>

<h3>Aplicación práctica <span class="art">p. 61–65</span></h3>
<p>Aprender más rápido que los competidores puede ser la <b>única ventaja sostenible</b> a largo plazo. Para eso, el aprendizaje tiene que entrar en las rutinas y los procesos diarios: ser parte del "DNA organizacional".</p>
<h4>Cómo elegir el modelo</h4>
<p>Cada organización es única (cultura, estructura, objetivos): un abordaje estandarizado puede no servir. Elegir no es adoptar el más reciente o popular, sino el que <b>mejor se alinea al contexto</b>.</p>
<div class="three">
  <div class="col c-a"><span class="stamp">Primeiro passo</span><b>Avaliação das necessidades</b><p>Dónde está y adónde quiere llegar: ambientes interno y externo, lagunas de competencia, desafíos y objetivos de aprendizaje.</p></div>
  <div class="col c-b"><span class="stamp">Critério</span><b>Adaptabilidade</b><p>Nonaka e Takeuchi (1997): en un ambiente cambiante se necesitan <b>modelos flexibles</b>, que puedan adaptarse o modificarse.</p></div>
  <div class="col c-c"><span class="stamp">Critério</span><b>Partes interessadas</b><p>Involucrar a líderes, funcionarios y demás afectados: su perspectiva y feedback indican qué modelo funciona y cómo integrarlo a la cultura.</p></div>
</div>
<p>La elección es un proceso <b>deliberado</b>: el abordaje debe ser adaptable, relevante y alineado con la cultura y la estrategia.</p>
<h4>Los 4 desafíos de implementación <span class="art">p. 63–64</span></h4>
<div class="grid4">
  <div class="kc"><b>Resistência à mudança</b><span>Rutinas y procesos arraigados; empeora si el equipo siente que su expertise y experiencia son subestimadas.</span></div>
  <div class="kc"><b>Falta de entendimento ou clareza</b><span>Sobre el modelo elegido: implementación sin entrenamiento o sin comunicar objetivos y beneficios.</span></div>
  <div class="kc"><b>Falta de recursos</b><span>Financieros y de tiempo; se subestiman los costos de capacitación, tecnología y procesos.</span></div>
  <div class="kc"><b>Ausência de cultura de aprendizagem</b><span>Dificulta la implementación: hace falta un ambiente de curiosidad, experimentación y apertura al feedback.</span></div>
</div>
<h4>Medir y evaluar <span class="art">p. 64–65</span></h4>
<p>"O que não é medido, não é gerenciado" (enseñanzas de Peter Drucker). Indicadores según <span class="art">Nonaka e Takeuchi, 1997</span>: la <b>velocidad de desarrollo de nuevos productos</b> y la capacidad de <b>resolver problemas complejos</b> en tiempos cada vez más cortos. También se evalúa el clima y la cultura de aprendizaje con <b>encuestas de engajamento e satisfação</b>. La evaluación no es solo control: es un <b>mecanismo de retroalimentação</b> que ajusta y, si hace falta, redefine estrategias.</p>

<h3>Innovaciones y tendencias <span class="art">p. 65–70</span></h3>

  <div class="mg-row"><div class="mg-old"><span class="chip">Conteúdo igual para todos</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>IA e análise de dados</b><span>Aprendizaje personalizado al ritmo y a las necesidades de cada aprendiz; mejor retorno sobre la inversión en capacitación.</span></div></div>
</div>
<p>Pero la tecnología <b>no es una panaceia</b>: la humanización, las necesidades individuales y la cultura de aprendizaje continua siguen siendo esenciales.</p>
<h4>Modelos híbridos <span class="art">p. 67–68</span></h4>
<div data-widget="terms" data-key="u3-hibrido"></div>
<div class="sides">

</div>
<p>Muy relevantes con equipos dispersos geográficamente: todos acceden al mismo contenido. Condición: integración efectiva entre lo presencial y lo on-line, para una experiencia coherente.</p>
<h4>Aprendizagem contínua y "aprender a aprender" <span class="art">p. 68–69</span></h4>
<ul class="clean">
  <li>"Aprender a aprender" es una habilidad esencial para la supervivencia profesional y la adaptabilidad personal.</li>
  <li>Rompe la idea de que se aprende solo en fases (escuela, universidad): el aprendizaje es un flujo a lo largo de toda la vida <span class="art">Almeida, 2010</span>.</li>
  <li>Incluye habilidades técnicas y <b>socioemocionales</b> (liderazgo, empatía, creatividad); el colaborador es <b>protagonista</b> de su desarrollo <span class="art">Dias, 2015</span>.</li>
  <li>Plataformas on-line, <b>MOOCs</b> (Cursos On-line Abertos e Massivos) y redes sociales de aprendizaje: aprendizaje <b>autónomo y descentralizado</b>.</li>
  <li>Para la organización: cultivar una cultura que valore aprender. Para el individuo: <b>mentalidade de crescimento</b> y postura proactiva <span class="art">Ferreira, 2014</span>.</li>
</ul>
<h4>ABP × aprendizagem centrada em desafios <span class="art">p. 69–70</span></h4>
<div class="two">
  <div class="kc"><b>ABP</b><span>Proyectos para resolver problemas reales; aprendices activos, soluciones creativas, trabajo colaborativo. Desarrolla trabajo en equipo, pensamiento crítico y comunicación.</span></div>
  <div class="kc"><b>Centrada em desafios</b><span>Lleva la ABP "um passo adiante": problemas complejos que <b>no necesariamente tienen una única solución correcta</b>; investigación profunda y manejo de ambigüedades.</span></div>
</div>
<p>Ambas mejoran la <b>retención</b> de información y la <b>aplicación práctica</b> de lo aprendido.</p>

<div class="box trap"><b class="box-h">Pegadinha: los años de los DOCX</b><p>El e-book usa <b>Senge (2004)</b> y <b>Argyris e Schön (1978)</b>. El DOCX del Desafio Colaborativo sugiere Senge <b>2014</b> y Argyris e Schön <b>1996</b> (Organizational Learning II). En la prueba vale el e-book.</p></div>

    <tr><th>2</th><td><b>Tecnologia</b>: la era digital cambia modelos de negocio. Sampaio (2008): la tecnología es un <b>catalisador</b> de cambios culturales.</td><td><b>Nova liderança</b>: un cambio en la alta administración trae nueva visión y nuevos valores.</td></tr>
    <tr><th>3</th><td><b>Sociedade</b>: movimientos sociales, tendencias demográficas, <b>mudanças econômicas globais</b> (Oliveira e Martins, 2010).</td><td><b>Estagnação, declínio ou expansão acelerada</b>: la cultura que sirvió antes puede no servir ahora (Barros e Silva, 2009).</td></tr>
    <tr><th>4</th><td><b>Governo</b>: leyes y regulamentos ambientales, trabajistas o de seguridad. Una cultura de conformidad evita penalidades.</td><td><b>Feedbacks internos</b>: pesquisas de satisfação, feedback de equipos, análisis de desempeño. La voz de los miembros es un "<b>barômetro poderoso</b>" (Ribeiro e Teixeira, 2015).</td></tr>
  </tbody>
</table></div>

<div class="box trap"><b class="box-h">Pegadinha</b><p>La economía aparece en los dos lados. <b>Mudanças econômicas globais</b> = externo (sociedade). <b>Estagnação, declínio ou expansão acelerada</b> de la propia empresa = interno. La <b>liderança</b> también es fator interno, aunque el nuevo líder venga de fuera.</p></div>

<h3>La resistencia al cambio <span class="art">p. 16–17</span></h3>
<div class="balance">
  <div class="pan"><span class="eyebrow">Nivel individual</span><b>Fatores psicológicos</b><p>Miedo a lo desconocido, a perder status o el empleo. Siqueira e Ramos (2012): tendencia natural a apegarse a lo familiar y a ver el cambio con sospecha.</p></div>
  <div class="pan"><span class="eyebrow">Nivel organizacional</span><b>Barreiras organizacionais</b><p>Estructuras y procesos establecidos, culturas muy arraigadas, <b>sistemas inflexíveis</b>, prácticas de años o décadas.</p></div>
  <div class="fulcrum"><b>Cómo se equilibra</b><span>Comunicação aberta e transparente + envolver os colaboradores con senso de propriedade.</span></div>
</div>
<p>Envolver a los colaboradores no solo reduce la resistencia: <b>trae novas perspectivas</b> que enriquecen el proceso. Y la resistencia no es necesariamente enemiga: <span class="art">Gomes e Barbosa, 2017</span> la ven como <b>um sinal que deve ser ouvido</b>, porque muestra áreas no consideradas y preocupaciones legítimas.</p>

<h3>Las 4 etapas para cambiar la cultura <span class="art">p. 18–22</span></h3>
<div class="two">
  <div class="kc"><b>Parte visível del iceberg</b><span>Comportamentos, rituais e símbolos.</span></div>
  <div class="kc"><b>Parte submersa (la mayor)</b><span>Crenças, valores e pensamentos enraizados.</span></div>
</div>
<p>Conocer la cultura actual es como el <b>médico que diagnostica antes de recetar</b>: permite decidir qué mantener, qué modificar y qué reinventar. Soares (2011): la cultura refleja historias, éxitos, fracasos y aprendizajes a lo largo del tiempo.</p>
<div data-widget="steps" data-key="u4-etapas-mudanca"></div>
<h4>Planejar: imponer no alcanza <span class="art">p. 20</span></h4>
<div class="migr"><div class="mg-row"><div class="mg-old"><span class="chip">Solo top-down</span></div><span class="mg-arrow" aria-hidden="true">→</span><div class="mg-new"><b>Top-down + bottom-up</b><span>Gomes e Rodrigues (2014): garantiza alinhamento estratégico y fomenta la propriedade y la aceptación del cambio.</span></div></div></div>
<ul class="clean">
  <li><b>Campeões ou embaixadores da mudança</b> (Lopes e Castro, 2016): personas influyentes en varios niveles que median entre la visión estratégica de la liderança y la ejecución en el "chão de fábrica".</li>
  <li><b>Marcos claros</b> y criterios de éxito: la mudança es "um processo, e não um evento isolado". Los marcos mantienen el momentum y permiten celebrar pequeñas victorias.</li>
  <li><b>Anticipar obstáculos</b> (resistencia, límites tecnológicos o financieros): estrategias <b>proativas</b>, no solo reativas.</li>
</ul>
<h4>Implementar e reforçar <span class="art">p. 21–22</span></h4>
<div class="grid4">
  <div class="kc"><b>Programas de treinamento</b><span>Alinear, educar y capacitar. Más que aprendizaje: un vehículo para <b>comunicar e internalizar</b> la nueva cultura.</span></div>
  <div class="kc"><b>Sistemas de recompensa</b><span>Reconocer comportamientos alineados para incentivar su adopción. No solo dinero: también reconocimiento.</span></div>
  <div class="kc"><b>Avaliação contínua</b><span>Franco e Mendes (2018): enfoque <b>iterativo</b>; la mudança como proceso evolutivo y adaptable.</span></div>
  <div class="kc"><b>Resiliência</b><span>Pinto e Sousa (2019): no es solo superar obstáculos, es aprender, crecer y evolucionar a través de ellos.</span></div>
</div>
<div class="box trap"><b class="box-h">Pegadinha: "catalisador"</b><p>La palabra se repite en la unidad. <b>Tecnologia</b> = catalisador de mudanças culturais (Sampaio, p. 14). <b>Liderança</b> = catalisador da mudança cultural (p. 19). <b>Segurança psicológica</b> = catalisador para a inovação (p. 33). <b>Colaboração interdisciplinar</b> = catalisador para o aprendizado (p. 49). Lee de qué tema habla la pregunta.</p></div>
<div class="box prova"><b class="box-h">Cayó en los ejercicios</b><p><b>U4 Q01</b> asoció los elementos con su descripción: valores = bússola moral, normas = regras informais, rituais = premiações, aniversários y reuniões matinais. <b>Q02</b> (I–IV) dio por correctas "culturas abertas inovam" y "cultura positiva atrai e retém talentos"; las trampas cambiaban objetivos <i>comuns</i> y exageraban la resiliência. <b>Q03</b> (lacunas): fatores <b>internos</b> – novas <b>perspectivas</b>. <b>Q04</b> (V/F) mezcló externos con internos. <b>Q05</b>: cultura desejada alineada a missão, visão e objetivos estratégicos. <b>Q21</b>: envolver os colaboradores con senso de propriedade. <b>Q22</b> asoció treinamento, recompensas, avaliação contínua y resiliência con su función.</p></div>

<p class="lead">El capítulo parte de una definición: <mark>aprendizagem organizacional es la capacidad de criar, adquirir e transferir conhecimento y de modificar comportamentos</mark> para reflejar nuevos conocimientos e insights. No es acumular información: es <b>refletir, questionar, adaptar e transformar</b>. <span class="art">p. 23–24</span></p>
<div data-widget="terms" data-key="u4-def-ao"></div>

<h3>Incremental × transformacional <span class="art">Torres e Fernandes, 2015</span></h3>
<div class="two">
  <div class="kc"><b>Incremental</b><span>Nuevos conocimientos se suman a lo que ya se sabe.</span></div>
  <div class="kc"><b>Transformacional</b><span>Lleva a cambios <b>paradigmáticos</b> en cómo la organización ve el mundo y opera.</span></div>
</div>

<h3>Individual × coletiva <span class="art">p. 24–27</span></h3>
<div class="sides">
  <div class="side"><span class="eyebrow">El pilar</span><b>Aprendizagem individual</b><p>Proceso por el cual los individuos <b>adquirem, interpretam, refletem e respondem</b> a nuevas informaciones y experiencias (<span class="art">Rocha e Almeida, 2013</span>). Puede ser <b>formal</b> (treinamentos, cursos) o <b>informal</b> (día a día: experiencias, interacciones, reflexiones).</p></div>
  <div class="side-link" aria-hidden="true"><span>simbiose</span></div>
  <div class="side"><span class="eyebrow">La fuerza que une</span><b>Aprendizagem coletiva</b><p>Une, amplifica y disemina el conocimiento. <b>No es la suma</b> de las individuales: envuelve <b>interação, negociação e construção conjunta de significados</b>, con influencia mutua (<span class="art">Santos e Teixeira, 2014</span>).</p></div>
</div>
<p>La individual es "o pilar fundamental sobre o qual todo o edifício da aprendizagem organizacional é construído". Pero no puede quedar aislada: tiene que compartirse para volverse <b>capital intelectual coletivo</b>. <span class="art">Dias e Matos, 2015</span>: el conocimiento compartido se multiplica y se transforma; "o todo é maior do que a soma das partes". Esa conexión no es automática: requiere mecanismos de compartilhamento, comunicação eficaz y una cultura que valore el aprendizaje, con <b>líderes que den el ejemplo</b>.</p>

<h4>Kolb y los estilos de aprendizaje <span class="art">p. 24</span></h4>
<p>Cada persona tiene un estilo único. Según el e-book, Kolb (1984 apud Sampaio e Menezes, 2016) identifica <b>cuatro estilos</b>:</p>
<div class="chips"><span class="chip">Ativo</span><span class="chip">Reflexivo</span><span class="chip">Teórico</span><span class="chip">Pragmático</span></div>

<p><span class="art">Costa e Dias, 2015</span>: proceso constante de adquirir conocimientos, habilidades y competencias, <b>esté o no vinculado a instituciones educativas formales</b>. Responde a la obsolescencia del conocimiento. <span class="art">Ferreira e Martins, 2019</span>: hay que <b>anticipar</b> los cambios, no solo reaccionar.</p>

<div class="box trap"><b class="box-h">Pegadinha</b><p>Son <b>cinco</b> tipos: el quinto, <b>tutoria</b>, se olvida fácil. El ciclo de la aprendizagem experiencial aparece dos veces con palabras distintas: p. 55, citando a Kolb, "experiência, reflexão, conceitualização e experimentação"; p. 61, sin autor, "experimentar, refletir, teorizar e aplicar". Es la misma idea. Y <b>tutoria</b> (p. 55), <b>mentorização</b> (p. 60) y <b>mentoria</b> (p. 28) son la misma idea: alguien con más experiencia orienta a quien tiene menos.</p></div>

<h3>Los 5 componentes de un programa eficaz <span class="art">p. 56–57</span></h3>
<div class="grid4">
  <div class="kc"><b>Alinhamento estratégico</b><span>Sin él, se invierte en capacitaciones que no agregan valor real.</span></div>
  <div class="kc"><b>Customização ao público-alvo</b><span>Nivel de experiencia, conocimiento previo y preferencias.</span></div>
  <div class="kc"><b>Avaliação e feedback contínuo</b><span>Muestra si se alcanzan los objetivos y dónde están las lacunas.</span></div>
  <div class="kc"><b>Flexibilidade e atualização</b><span>Contenido siempre relevante y actual.</span></div>
  <div class="kc"><b>Fomento à aplicação prática</b><span>El aprendizaje se solidifica cuando se pone en práctica.</span></div>
</div>
<h4>Conocer al público-alvo <span class="art">p. 57–58</span></h4>
<p>Hacer un programa sin mirar al público "seria como tentar construir um edifício sem levar em conta as necessidades dos futuros habitantes". El público-alvo es el <b>coração</b> de la iniciativa, y la diversidad (generaciones, backgrounds, niveles, aspiraciones) exige programas inclusivos y relevantes. El análisis debe incluir:</p>
<div class="chips"><span class="chip">Necessidades de aprendizado <small>lacunas</small></span><span class="chip">Estilos de aprendizado <small>palestras, prática, estudo de caso</small></span><span class="chip">Expectativas <small>qué esperan ganar</small></span></div>

<h3>Competencias y cómo desarrollarlas <span class="art">p. 59–63</span></h3>
<p><span class="art">Deluca e Oliveira, 2017</span>: competencias son un conjunto integrado de <b>habilidades, conhecimentos e atitudes</b> que permiten realizar tareas según padrões de desempenho. No es solo saber: es <b>saber fazer efetivamente</b>. Habilidad = capacidad de movilizar y poner en acción conocimientos, valores y actitudes.</p>
<div class="acro">
  <div><b>C</b><span><b>Conhecimentos</b>: el saber.</span></div>
  <div><b>H</b><span><b>Habilidades</b>: movilizar y poner en acción.</span></div>
  <div><b>A</b><span><b>Atitudes</b>: la disposición que completa el "saber fazer".</span></div>
</div>
<p>Las estrategias de desarrollo son "abordagens deliberadas e estruturadas" (<span class="art">Ruas, 2009</span>). Hay que considerar la <b>diversidade de aprendizagem</b>, y la estrategia debe estar alineada con los objetivos y la cultura (<span class="art">Almeida, 2014</span>). Ejemplos de la p. 60–61: aprendizagem baseada em projetos, <b>mentorização</b> (experientes orientan a novatos) y tecnologías (plataformas EAD, simulações, jogos, ambientes virtuais colaborativos).</p>
<div class="table-wrap"><table class="cmp">
  <thead><tr><th>Método</th><th>Cómo funciona</th><th>Qué dice el e-book</th></tr></thead>
  <tbody>
    <tr><th>Tradicional</th><td>Instructor = principal detentor del conocimiento; participantes = <b>receptores passivos</b>.</td><td>"Ainda são muito relevantes, mas já não são suficientes por si só."</td></tr>
    <tr><th>Ativos</th><td>Aprendizagem baseada em <b>problemas</b>, estudos de caso, simulações.</td><td>Ganan espacio; construcción colectiva del conocimiento.</td></tr>
    <tr><th>Experiencial</th><td>Actividades prácticas: <b>experimentar, refletir, teorizar e aplicar</b>.</td><td>Ciclo continuo, más integrado a la realidad del trabajo.</td></tr>
    <tr><th>EAD e on-line</th><td>AVA, gamificação, podcasts, webinars.</td><td>"<mark>Tornaram-se essenciais</mark>."</td></tr>
  </tbody>
</table></div>
<p>La eficacia depende de la <b>harmonia entre conteúdo, método e contexto</b>. <span class="art">p. 62</span></p>
<div class="sides">
  <div class="side"><span class="eyebrow">Barreiras comuns · p. 62</span><b>Lo que traba</b><p>Resistência à mudança (miedo a lo desconocido o creer que lo antiguo basta) · falta de recursos (tiempo, dinero, infraestructura) · ausência de alinhamento estratégico.</p></div>
  <div class="side-link" aria-hidden="true"><span>soluções</span></div>
  <div class="side"><span class="eyebrow">Soluções · p. 63</span><b>Lo que destraba</b><p>Comunicação efetiva (explicar el "porquê") · investimento estratégico (Ribeiro, 2015) · alinhamento contínuo · cultura de aprendizagem (reconocer, recompensar y compartir).</p></div>
</div>

<h3>Implementação, monitoramento e avaliação (IMA) <span class="art">p. 63–68</span></h3>
<p><span class="art">Cardoso, 2018</span>: el IMA es un enfoque estructurado para garantizar que los programas se implementen bien, se monitoreen siempre y se evalúen con regularidad. La avaliação, "geralmente relegada a um segundo plano", es la que muestra el impacto real y el <b>retorno sobre o investimento</b>.</p>
<div data-widget="steps" data-key="u4-ima"></div>
<div class="dp"><div class="dp-row">
  <span class="dp-pt">Início</span>
  <span class="dp-seg c1"><b>Monitoramento</b> contínuo, durante la implementación</span>
  <span class="dp-pt">Término</span>
  <span class="dp-seg c2"><b>Avaliação</b> generalmente al término</span>
</div></div>
<ul class="clean">
  <li><b>Implementação</b> (Santos e Oliveira, 2018): traducir teoría y planejamento en práctica. Stakeholders que conocen sus papeles, infraestructura lista (salas, materiales, plataformas EAD), instructores y facilitadores entrenados. Es <b>dinámica</b>, no estática: "o coração pulsante" del programa.</li>
  <li><b>Monitoramento</b> (Freitas e Carvalho, 2018): no es un chequeo, es un proceso continuo que informa ajustes. Dos áreas: <b>resultados da aprendizagem</b> y <b>eficiência do processo</b> (uso de recursos, satisfacción). Herramientas: testes, questionários, feedbacks formales e informales, participación en plataformas EAD.</li>
  <li><b>Avaliação</b>: examen pormenorizado de lo que funcionó y de lo que hay que ajustar. No busca apuntar fallas sino oportunidades. Cierra el ciclo y es punto de partida del siguiente.</li>
</ul>
<div data-widget="steps" data-key="u4-niveis"></div>

<script>
(function () {
  'use strict';
  var GC = window.GC;
  var MODS = GC.modules.slice().sort(function (a, b) { return a.n - b.n; });
  var WID = GC.widgets, QS = GC.questions, CARDS = GC.cards;
  var UNITS = {
    1: 'Uma visão geral sobre a gestão do conhecimento',
    2: 'Processos, tecnologias e ferramentas de GC',
    3: 'Aprendizagem organizacional',
    4: 'Cultura organizacional para a GC e aprendizagem'
  };
  var GRADES = [['U1', '10'], ['U2', '10'], ['U3', '9,6'], ['U4', '10']];
  var TOP = {}; MODS.forEach(function (m) { TOP[m.id] = { name: m.short, mod: m.id, unit: m.unit }; });
  var QMAP = {}; QS.forEach(function (q) { QMAP[q.id] = q; });
  var MMAP = {}; MODS.forEach(function (m) { MMAP[m.id] = m; });
  var LS = 'gc-estudo-v1', LS_SESS = 'gc-sesion-v1';
  var L = 'ABCDE';
  var EXAM_N = 20;
  var view = document.getElementById('view');

  /* ---------------- utilidades ---------------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function range(n) { var r = []; for (var i = 0; i < n; i++) r.push(i); return r; }
  function nota(x) { return (Math.round(x * 10) / 10).toFixed(1).replace('.', ','); }
  function mmss(s) { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function pctColor(p) { return p < 0.5 ? 'var(--bad)' : p < 0.75 ? 'var(--warn)' : 'var(--good)'; }
  function fmtDate(ts) { try { return new Date(ts).toLocaleDateString('es', { day: 'numeric', month: 'short' }) + ' · ' + new Date(ts).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function hitsN(m) { return (m.hits || []).length; }
  function utag(u) { return '<span class="utag u' + u + '">Unidade ' + u + '</span>'; }
  var toastT;
  function toast(msg) {
    var t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2400);
  }

  /* ---------------- estado y guardado ---------------- */
  function blank() { return { v: 1, updatedAt: 0, mods: {}, notes: {}, exams: [], wrong: {}, stats: {}, seen: {}, cards: {}, examDate: '' }; }
  function norm(s) {
    var b = blank();
    if (!s || typeof s !== 'object' || s.v !== 1) return b;
    Object.keys(b).forEach(function (k) {
      if (s[k] !== undefined && typeof s[k] === typeof b[k] && Array.isArray(s[k]) === Array.isArray(b[k])) b[k] = s[k];
    });
    return b;
  }
  var state = (function () { try { return norm(JSON.parse(localStorage.getItem(LS))); } catch (e) { return blank(); } })();
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) { } }
  function save() { state.updatedAt = Date.now(); saveLocal(); queueRemote(); }

  var SYNC = { connecting: 'Conectando…', cloud: 'Guardado en tu cuenta', local: 'Guardado en este navegador', error: 'Sin conexión · guardado aquí' };
  var syncMode = 'connecting';
  function setSync(m) { syncMode = m; document.querySelectorAll('[data-sync]').forEach(function (el) { el.textContent = SYNC[m]; el.setAttribute('data-mode', m); }); }

  var dbDoc = null, remoteT = null, chain = Promise.resolve(), lastSent = '';
  function queueRemote(delay) { if (!dbDoc) return; clearTimeout(remoteT); remoteT = setTimeout(pushRemote, delay == null ? 1500 : delay); }
  function pushRemote() {
    if (!dbDoc) return;
    var body = JSON.stringify(state);
    if (body === lastSent) return;
    var ref = dbDoc;
    chain = chain.then(function () { return ref.set(JSON.parse(body)); })
      .then(function () { lastSent = body; setSync('cloud'); })
      .catch(function (e) {
        var c = e && e.code;
        if (c === 'invalid_argument' || c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { dbDoc = null; setSync('local'); }
        else setSync('error');
      });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { clearTimeout(remoteT); pushRemote(); } });

  function initRemote() {
    var tries = 0, done = false;
    var guard = setTimeout(function () { if (!done) setSync('local'); }, 12000);
    (function wait() {
      if (window.claude && typeof window.claude.use === 'function') return connect();
      if (++tries > 20) { done = true; clearTimeout(guard); return setSync('local'); }
      setTimeout(wait, 150);
    })();
    function connect() {
      Promise.all([window.claude.use('user'), window.claude.use('db')]).then(function (r) {
        var user = r[0], db = r[1];
        if (!user || !db) { done = true; setSync('local'); return; }
        return user.id().then(function (uid) {
          if (!uid) { done = true; setSync('local'); return; }
          var ref = db.doc('data/users/' + uid + '/estudo');
          return ref.get().then(function (snap) {
            done = true; clearTimeout(guard);
            dbDoc = ref;
            var remote = snap.exists ? snap.data() : null;
            if (remote && remote.v === 1 && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
              state = norm(JSON.parse(JSON.stringify(remote)));
              saveLocal(); lastSent = JSON.stringify(state);
              setSync('cloud'); render(false);
            } else if (state.updatedAt > 0 && (!remote || state.updatedAt > (remote.updatedAt || 0))) {
              setSync('cloud'); queueRemote(0);
            } else { lastSent = JSON.stringify(state); setSync('cloud'); }
          });
        });
      }).catch(function () { done = true; setSync('local'); });
    }
  }

  /* ---------------- sesión de preguntas ---------------- */
  var sess = (function () { try { var s = JSON.parse(localStorage.getItem(LS_SESS)); return s && s.items && s.items.every(function (it) { return QMAP[it.id]; }) ? s : null; } catch (e) { return null; } })();
  function saveSess() { try { if (sess) localStorage.setItem(LS_SESS, JSON.stringify(sess)); else localStorage.removeItem(LS_SESS); } catch (e) { } }

  function record(q, ok) {
    var s = state.stats[q.t] || [0, 0]; s = [s[0] + (ok ? 1 : 0), s[1] + 1]; state.stats[q.t] = s;
    state.seen[q.id] = (state.seen[q.id] || 0) + 1;
    if (ok) delete state.wrong[q.id]; else state.wrong[q.id] = 1;
  }

  function pickFrom(pool, n, gens) {
    var scored = pool.map(function (q) { return { q: q, s: (state.seen[q.id] || 0) + Math.random() * 1.6 - (state.wrong[q.id] ? 0.6 : 0) }; });
    scored.sort(function (a, b) { return a.s - b.s; });
    var out = [];
    scored.forEach(function (o) {
      if (out.length >= n) return;
      if (o.q.gen) { if (gens.has(o.q.gen)) return; gens.add(o.q.gen); }
      out.push(o.q);
    });
    scored.forEach(function (o) { if (out.length < n && out.indexOf(o.q) < 0) out.push(o.q); });
    return out;
  }
  function makeItems(qs) { return qs.map(function (q) { return { id: q.id, order: shuffle(range(q.a.length)) }; }); }

  /* Reparto: n preguntas entre los módulos de una lista, en proporción a lo que cayó en los ejercicios (mínimo 1 por módulo) */
  function quota(mods, n) {
    var w = mods.map(function (m) { return hitsN(m) + 1; }), tot = w.reduce(function (a, b) { return a + b; }, 0);
    var base = mods.map(function (m, i) { return Math.max(1, Math.floor(n * w[i] / tot)); });
    var sum = base.reduce(function (a, b) { return a + b; }, 0);
    var order = mods.map(function (m, i) { return i; }).sort(function (a, b) { return (n * w[b] / tot - Math.floor(n * w[b] / tot)) - (n * w[a] / tot - Math.floor(n * w[a] / tot)); });
    var k = 0; while (sum < n) { base[order[k % order.length]]++; sum++; k++; }
    k = 0; var byW = mods.map(function (m, i) { return i; }).sort(function (a, b) { return w[a] - w[b]; });
    while (sum > n) { var ix = byW[k % byW.length]; if (base[ix] > 1) { base[ix]--; sum--; } k++; }
    var out = {}; mods.forEach(function (m, i) { out[m.id] = base[i]; }); return out;
  }
  function examQuota() {
    var out = {}, per = Math.floor(EXAM_N / 4);
    [1, 2, 3, 4].forEach(function (u) { var q = quota(MODS.filter(function (m) { return m.unit === u; }), per); Object.keys(q).forEach(function (k) { out[k] = q[k]; }); });
    return out;
  }

  function startSession(kind, arg) {
    var items, title, mode = 'practice', gens = new Set(), list = [];
    if (kind === 'exam') {
      var QU = examQuota();
      Object.keys(QU).forEach(function (t) { list = list.concat(pickFrom(QS.filter(function (q) { return q.t === t; }), QU[t], gens)); });
      items = makeItems(shuffle(list)); title = 'Simulacro de ' + EXAM_N + ' preguntas'; mode = 'exam';
    } else if (kind === 'unitexam') {
      var u = +arg, QV = quota(MODS.filter(function (m) { return m.unit === u; }), 10);
      Object.keys(QV).forEach(function (t) { list = list.concat(pickFrom(QS.filter(function (q) { return q.t === t; }), QV[t], gens)); });
      items = makeItems(shuffle(list)); title = 'Unidade ' + u + ' · 10 preguntas'; mode = 'exam';
    } else if (kind === 'quick') {
      items = makeItems(pickFrom(QS.slice(), 10, gens)); title = 'Práctica rápida';
    } else if (kind === 'topic') {
      var pool = QS.filter(function (q) { return q.t === arg; });
      items = makeItems(shuffle(pickFrom(pool, Math.min(10, pool.length), gens))); title = 'Práctica · ' + TOP[arg].name;
    } else if (kind === 'wrong') {
      var ids = Array.isArray(arg) ? arg : Object.keys(state.wrong);
      items = makeItems(shuffle(ids.filter(function (id) { return QMAP[id]; }).map(function (id) { return QMAP[id]; })).slice(0, 20));
      title = 'Repaso de errores';
    }
    if (!items || !items.length) { toast('No hay preguntas para este modo todavía.'); return; }
    var replaced = sess && !sess.fin;
    sess = { mode: mode, title: title, items: items, ans: items.map(function () { return null; }), cur: 0, start: Date.now(), fin: false };
    saveSess();
    if (replaced) toast('Empezaste un intento nuevo.');
    go('simulado');
  }

  function finishSession() {
    var byTopic = {}, ok = 0;
    sess.items.forEach(function (it, i) {
      var q = QMAP[it.id], a = sess.ans[i], good = a != null && it.order[a] === 0;
      if (good) ok++;
      var b = byTopic[q.t] || [0, 0]; byTopic[q.t] = [b[0] + (good ? 1 : 0), b[1] + 1];
      if (sess.mode === 'exam') record(q, good);
    });
    var n = sess.items.length, secs = Math.round((Date.now() - sess.start) / 1000);
    sess.fin = true; sess.res = { ok: ok, n: n, score: ok / n * 10, secs: secs, byTopic: byTopic };
    state.exams.push({ at: Date.now(), mode: sess.mode, title: sess.title, ok: ok, n: n, score: Math.round(ok / n * 100) / 10, secs: secs, byTopic: byTopic });
    if (state.exams.length > 40) state.exams = state.exams.slice(-40);
    save(); saveSess();
  }

  /* ---------------- navegación ---------------- */
  var VIEWS = ['panel', 'estudiar', 'simulado', 'tarjetas', 'notas'];
  function parse(h) { h = (h || '').replace(/^#/, ''); if (h.indexOf('m-') === 0 && MMAP[h.slice(2)]) return { v: 'modulo', id: h.slice(2) }; if (VIEWS.indexOf(h) >= 0) return { v: h }; return { v: 'panel' }; }
  var route = parse(location.hash);
  function go(token) {
    route = parse(token);
    try { history.pushState(null, '', '#' + token); } catch (e) { }
    render(true);
  }
  window.addEventListener('popstate', function () { route = parse(location.hash); render(true); });
  window.addEventListener('hashchange', function () { var r = parse(location.hash); if (r.v !== route.v || r.id !== route.id) { route = r; render(true); } });

  function render(top) {
    var navKey = route.v === 'modulo' ? 'estudiar' : route.v;
    document.querySelectorAll('[data-nav]').forEach(function (a) { if (a.getAttribute('data-nav') === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    var html = route.v === 'estudiar' ? studyHTML() : route.v === 'modulo' ? moduleHTML(MMAP[route.id]) : route.v === 'simulado' ? simHTML() : route.v === 'tarjetas' ? cardsHTML() : route.v === 'notas' ? notesHTML() : panelHTML();
    view.innerHTML = '<div class="wrap">' + html + '</div>';
    bind();
    if (top) { window.scrollTo(0, 0); }
    setSync(syncMode);
  }

  /* ---------------- PANEL ---------------- */
  function countdownHTML() {
    if (!state.examDate) {
      return '<div class="count"><div style="display:grid;gap:4px"><b>¿Cuándo es la prueba?</b><p>Pon la fecha y te muestro cuántos días faltan.</p></div>' +
        '<input type="date" id="exam-date" aria-label="Fecha de la prueba"></div>';
    }
    var d = new Date(state.examDate + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
    var days = Math.round((d - t) / 864e5), big, label;
    if (days > 1) { big = days; label = 'días para la prueba'; }
    else if (days === 1) { big = 1; label = 'día: es mañana'; }
    else if (days === 0) { big = '¡Hoy!'; label = 'es el día de la prueba'; }

    h += '<div class="modes">' +
      '<div class="mode main-mode"><span class="eyebrow">Toda la materia · ' + EXAM_N + ' preguntas</span><h3>Simulacro completo</h3><p>5 preguntas por unidad, repartidas según lo que más cayó en tus ejercicios. Ves la corrección al final.</p><button class="btn btn-primary" data-act="start-exam">Empezar simulacro</button></div>' +
      '<div class="mode"><span class="eyebrow">Una unidad · 10 preguntas</span><h3>Simulacro por unidad</h3><label class="sr" for="unit-sel">Unidad</label><select id="unit-sel">' + [1, 2, 3, 4].map(function (u) { return '<option value="' + u + '">Unidade ' + u + ' · ' + esc(UNITS[u]) + '</option>'; }).join('') + '</select><button class="btn" data-act="start-unit">Empezar</button></div>' +
      '<div class="mode"><span class="eyebrow">10 preguntas</span><h3>Práctica rápida</h3><p>Mezcla de todos los temas. Ves la respuesta y la explicación al instante.</p><button class="btn" data-act="start-quick">Empezar</button></div>' +
      '<div class="mode"><span class="eyebrow">Un tema</span><h3>Practicar por tema</h3><label class="sr" for="topic-sel">Tema</label><select id="topic-sel">' + topicOptions() + '</select><button class="btn" data-act="start-topic-sel">Empezar</button></div>' +
      '<div class="mode"><span class="eyebrow">Mis errores · ' + wrongN + '</span><h3>Repasar errores</h3><p>Las preguntas que fallaste. Cuando aciertas una, sale de la lista.</p><button class="btn" data-act="start-wrong"' + (wrongN ? '' : ' disabled') + '>' + (wrongN ? 'Repasar ' + wrongN : 'Sin errores por ahora') + '</button></div>' +
      '</div>';
    h += '<p class="muted">Banco de ' + QS.length + ' preguntas y variantes. Cada respuesta cuenta para tu dominio por tema en el Panel.</p>';
    return h;
  }

  function runnerHTML() {
    var n = sess.items.length, cur = sess.cur, it = sess.items[cur], q = QMAP[it.id], chosen = sess.ans[cur];
    var exam = sess.mode === 'exam', reveal = !exam && chosen != null;
    var answered = sess.ans.filter(function (a) { return a != null; }).length;
    var h = '<div class="runner"><div class="run-top"><div class="row-between"><span class="eyebrow">' + esc(sess.title) + '</span><span class="timer" data-timer>' + mmss((Date.now() - sess.start) / 1000) + '</span></div>' +
      '<div class="row-between"><b>Pregunta ' + (cur + 1) + ' de ' + n + '</b><span class="muted">' + answered + ' respondidas</span></div>' +
      '<div class="run-bar" aria-hidden="true"><i style="width:' + (answered / n * 100) + '%"></i></div></div>';
    h += qHTML(q, it.order, chosen, reveal, exam ? 'corrección al final' : '');
    h += '<div class="row-between"><button type="button" class="btn" data-act="prev"' + (cur === 0 ? ' disabled' : '') + '>← Anterior</button>';
    if (exam) {
      h += cur < n - 1 ? '<button type="button" class="btn btn-primary" data-act="next">Siguiente →</button>' : '<button type="button" class="btn btn-primary" data-act="finish">Entregar prova</button>';
    } else {
      if (reveal) h += cur < n - 1 ? '<button type="button" class="btn btn-primary" data-act="next">Siguiente →</button>' : '<button type="button" class="btn btn-primary" data-act="finish">Ver resultado</button>';
      else h += '<span class="muted">Elige una alternativa</span>';
    }
    h += '</div>';
    if (confirmFinish) {
      var miss = n - answered;
      h += '<div class="confirm" role="alertdialog" aria-label="Confirmar entrega"><b>' + (miss ? 'Te faltan ' + miss + ' preguntas sin responder.' : '¿Entregar la prova?') + '</b><span>' + (miss ? 'Las que no respondas cuentan como error.' : 'Vas a ver tu nota y la corrección.') + '</span><div class="row"><button type="button" class="btn btn-primary" data-act="finish-yes">Entregar</button><button type="button" class="btn" data-act="finish-no">Seguir respondiendo</button></div></div>';
    }
    if (exam) {
      h += '<section class="card"><div class="section-h"><h3>Mapa de la prova</h3><button type="button" class="btn btn-sm" data-act="finish">Entregar</button></div><div class="qgrid">' +
        sess.items.map(function (_, i) { return '<button type="button" class="qn' + (sess.ans[i] != null ? ' ans' : '') + (i === cur ? ' cur' : '') + '" data-jump="' + i + '" aria-label="Pregunta ' + (i + 1) + (sess.ans[i] != null ? ', respondida' : '') + '">' + (i + 1) + '</button>'; }).join('') + '</div></section>';
    }
    h += confirmQuit ? '<div class="confirm"><b>¿Salir sin terminar?</b><span>Se pierde este intento.</span><div class="row"><button type="button" class="btn" data-act="quit-yes">Salir</button><button type="button" class="btn btn-primary" data-act="quit-no">Seguir</button></div></div>'
      : '<div><button type="button" class="btn btn-quiet btn-sm" data-act="quit">Salir del simulacro</button></div>';
    return h + '</div>';
  }

  function resultHTML() {
    var r = sess.res, p = r.ok / r.n;
    var msg = p >= 0.8 ? 'Muy bien: estás listo. Repite un simulacro más para confirmar.' : p >= 0.6 ? 'Vas bien. Repasa los temas en rojo y amarillo.' : 'Repasa los módulos de los temas en rojo y vuelve a intentarlo.';
    var wrongIds = sess.items.filter(function (it, i) { return !(sess.ans[i] != null && it.order[sess.ans[i]] === 0); }).map(function (it) { return it.id; });
    var h = '<header class="result-head"><span class="eyebrow">' + esc(sess.title) + ' · terminado</span><div class="score"><span class="score-n">' + nota(r.score) + '<small>/10</small></span><span class="stamp" style="--stamp:' + pctColor(p) + '">' + r.ok + ' de ' + r.n + ' acertos</span></div><p class="muted">Tiempo: ' + mmss(r.secs) + '. ' + msg + '</p>' +
      '<div class="row"><button type="button" class="btn btn-primary" data-act="start-exam">Otro simulacro</button>' + (wrongIds.length ? '<button type="button" class="btn" data-act="practice-these" data-ids="' + esc(wrongIds.join(',')) + '">Practicar las ' + wrongIds.length + ' que fallé</button>' : '') + '<button type="button" class="btn btn-quiet" data-act="close-result">Volver a simulacros</button></div></header>';
    h += '<section class="card"><div class="section-h"><h2>Por tema</h2></div><div class="mastery">' + Object.keys(r.byTopic).sort(function (a, b) { return MMAP[a].n - MMAP[b].n; }).map(function (t) {
      var b = r.byTopic[t], pp = b[0] / b[1];
      return '<div class="m-row"><span class="m-name"><span class="utag u' + TOP[t].unit + '">U' + TOP[t].unit + '</span> ' + esc(TOP[t].name) + '</span><div class="m-bar" aria-hidden="true"><i style="width:' + Math.round(pp * 100) + '%;background:' + pctColor(pp) + '"></i></div><span class="m-pct">' + b[0] + '/' + b[1] + '</span>' + (pp < 1 ? '<a class="btn btn-sm btn-quiet m-act" href="#m-' + TOP[t].mod + '">Repasar módulo</a>' : '<span></span>') + '</div>';
    }).join('') + '</div></section>';
    h += '<section class="review"><h2>Corrección</h2>' + sess.items.map(function (it, i) {
      var q = QMAP[it.id], a = sess.ans[i], ok = a != null && it.order[a] === 0;
      return '<div class="rv ' + (ok ? 'ok' : 'no') + '"><div class="rv-h"><span class="rv-n">' + (i + 1) + '</span><b class="q-text" style="font-size:16px">' + esc(q.q) + '</b></div><div class="rv-a">' +
        (ok ? '' : '<span>Tu respuesta</span><span>' + (a == null ? '<i>Sin responder</i>' : esc(q.a[it.order[a]])) + '</span>') +
        '<span>Correcta</span><span>' + esc(q.a[0]) + '</span></div><p class="rv-exp">' + esc(q.exp) + '</p>' + refBadge(q) + '</div>';
    }).join('') + '</section>';
    return h;
  }

  /* ---------------- TARJETAS ---------------- */
  var fc = { topic: 'all', pend: true, deck: null, pos: 0, flip: false };
  function inFc(c) { return fc.topic === 'all' || c[0] === fc.topic || (fc.topic.indexOf('u') === 0 && TOP[c[0]] && 'u' + TOP[c[0]].unit === fc.topic); }
  function buildDeck() {
    fc.deck = shuffle(CARDS.map(function (_, i) { return i; }).filter(function (i) { return inFc(CARDS[i]) && (!fc.pend || !state.cards['c' + i]); }));
    fc.pos = 0; fc.flip = false;
  }
  function cardsHTML() {
    if (!fc.deck) buildDeck();
    var inTopic = CARDS.filter(inFc).length;
    var known = CARDS.filter(function (c, i) { return inFc(c) && state.cards['c' + i]; }).length;
    var h = '<header class="mod-head"><span class="eyebrow">Tarjetas · ' + CARDS.length + ' conceptos</span><h1>Repaso rápido</h1><p class="sub">Toca la tarjeta para ver la respuesta. Si la sabes, márcala y deja de aparecer en el modo "solo las que no sé".</p></header>';
    h += '<div class="row"><label class="sr" for="fc-topic">Tema</label><select id="fc-topic"><option value="all">Todos los temas</option>' +
      [1, 2, 3, 4].map(function (u) { return '<option value="u' + u + '"' + (fc.topic === 'u' + u ? ' selected' : '') + '>Toda la Unidade ' + u + '</option>'; }).join('') +
      topicOptions(fc.topic) + '</select>' +
      '<label class="check"><input type="checkbox" id="fc-pend"' + (fc.pend ? ' checked' : '') + '> Solo las que no sé</label></div>';
    h += '<div class="flash-wrap">';
    h += '<div class="row-between"><span class="eyebrow">' + (fc.deck.length ? 'Tarjeta ' + Math.min(fc.pos + 1, fc.deck.length) + ' de ' + fc.deck.length : 'Sin tarjetas pendientes') + '</span><span class="m-pct">Dominadas ' + known + ' de ' + inTopic + '</span></div>';
    h += '<div class="meter"><i style="width:' + (inTopic ? known / inTopic * 100 : 0) + '%;background:var(--good)"></i></div>';
    if (!fc.deck.length || fc.pos >= fc.deck.length) {
      h += '<div class="empty" style="text-align:center;display:grid;gap:12px;justify-items:center"><b style="font-size:18px;color:var(--ink)">' + (known === inTopic ? '¡Dominaste todas las tarjetas de este tema!' : 'Terminaste esta ronda.') + '</b><div class="row" style="justify-content:center"><button type="button" class="btn btn-primary" data-act="fc-restart">Otra ronda</button>' + (known ? '<button type="button" class="btn" data-act="fc-reset">Volver a marcar todas como pendientes</button>' : '') + '</div></div>';
    } else {
      var c = CARDS[fc.deck[fc.pos]];
      h += '<div class="flash' + (fc.flip ? ' flip' : '') + '"><div class="flash-in">' +
        '<button type="button" class="face face-front" data-act="flip" aria-label="Mostrar respuesta"' + (fc.flip ? ' tabindex="-1" aria-hidden="true"' : '') + '><span class="eyebrow">U' + TOP[c[0]].unit + ' · ' + esc(TOP[c[0]].name) + '</span><b>' + esc(c[1]) + '</b><span class="face-hint">Toca para ver la respuesta</span></button>' +
        '<button type="button" class="face face-back" data-act="flip" aria-label="Volver a la pregunta"' + (fc.flip ? '' : ' tabindex="-1" aria-hidden="true"') + '><span class="eyebrow">' + esc(c[1]) + '</span><span>' + esc(c[2]) + '</span></button>' +
        '</div></div>';
      h += '<div class="row"><button type="button" class="btn" data-act="fc-again">Otra vez</button><button type="button" class="btn btn-primary" data-act="fc-know">Ya la sé</button><button type="button" class="btn btn-quiet" data-act="fc-shuffle">Mezclar</button></div>';
    }
    return h + '</div>';
  }

  /* ---------------- NOTAS ---------------- */
  function notesHTML() {
    var h = '<header class="mod-head"><span class="eyebrow">Notas</span><h1>Mis notas</h1><p class="sub">Se guardan solas mientras escribes. Son las mismas que aparecen al final de cada módulo.</p></header><div class="notes-grid">';
    h += '<div class="note-item card"><label for="note-general">Notas generales <span class="saved" data-saved="general"></span></label><textarea id="note-general" data-note="general" placeholder="Ej.: dudas para la profesora, fecha y sala de la prueba"></textarea></div>';
    [1, 2, 3, 4].forEach(function (u) {
      h += '<h2 class="unit-h u' + u + '"><span class="dot" aria-hidden="true"></span>Unidade ' + u + ' <small>' + esc(UNITS[u]) + '</small></h2>';
      MODS.filter(function (m) { return m.unit === u; }).forEach(function (m) {
        h += '<div class="note-item"><label for="note-' + m.id + '"><span>' + m.n + '. ' + esc(m.title) + '</span><span class="row" style="gap:10px"><span class="saved" data-saved="' + m.id + '"></span><a href="#m-' + m.id + '" style="font-weight:400;font-size:14px">Abrir módulo</a></span></label><textarea id="note-' + m.id + '" data-note="' + m.id + '" placeholder="Sin notas todavía"></textarea></div>';
      });
    });
    return h + '</div>';
  }

  /* ---------------- enlaces de la vista ---------------- */
  var noteT = {};
  function bind() {
    view.querySelectorAll('[data-widget]').forEach(function (el) {
      var w = el.getAttribute('data-widget'), k = el.getAttribute('data-key');
      if (w === 'terms') wTerms(el, k); else if (w === 'steps') wSteps(el, k); else if (w === 'classify') wClassify(el, k);
    });
    var miniEl = view.querySelector('[data-mini]');
    if (miniEl && route.v === 'modulo') { newMini(MMAP[route.id]); renderMini(miniEl); }
    view.querySelectorAll('textarea[data-note]').forEach(function (ta) {
      var k = ta.getAttribute('data-note');
      ta.value = state.notes[k] || '';
      ta.addEventListener('input', function () {
        var lab = view.querySelector('[data-saved="' + k + '"]'); if (lab) lab.textContent = 'Guardando…';
        clearTimeout(noteT[k]);
        noteT[k] = setTimeout(function () {
          var v = ta.value;
          if (v.trim()) state.notes[k] = v; else delete state.notes[k];
          save(); if (lab) lab.textContent = 'Guardado';
        }, 700);
      });
    });
    var dateIn = document.getElementById('exam-date');
    if (dateIn) dateIn.addEventListener('change', function () { state.examDate = dateIn.value || ''; save(); render(false); });
    var fcT = document.getElementById('fc-topic');
    if (fcT) fcT.addEventListener('change', function () { fc.topic = fcT.value; buildDeck(); render(false); });
    var fcP = document.getElementById('fc-pend');
    if (fcP) fcP.addEventListener('change', function () { fc.pend = fcP.checked; buildDeck(); render(false); });
  }

  /* ---------------- clics globales ---------------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (a && !e.defaultPrevented) { var tok = a.getAttribute('href').slice(1); if (tok && (VIEWS.indexOf(tok) >= 0 || tok.indexOf('m-') === 0)) { e.preventDefault(); confirmFinish = confirmQuit = false; go(tok); return; } }

    var opt = e.target.closest('[data-opt]');
    if (opt && !opt.disabled) {
      var di = +opt.getAttribute('data-opt'), card = opt.closest('.qcard');
      if (view.querySelector('[data-mini]') && card && card.closest('[data-mini]')) {
        var it = mini.items.filter(function (x) { return x.q.id === card.getAttribute('data-qid'); })[0];
        if (it && it.chosen == null) { it.chosen = di; record(it.q, it.order[di] === 0); save(); renderMini(view.querySelector('[data-mini]')); }
        return;
      }
      if (sess && !sess.fin && route.v === 'simulado') {
        if (sess.mode === 'exam') { sess.ans[sess.cur] = di; saveSess(); render(false); }
        else if (sess.ans[sess.cur] == null) {
          sess.ans[sess.cur] = di; var cq = QMAP[sess.items[sess.cur].id];
          record(cq, sess.items[sess.cur].order[di] === 0); save(); saveSess(); render(false);
        }
        var fbEl = view.querySelector('.fb'); if (fbEl) fbEl.scrollIntoView({ block: 'nearest' });
      }
      return;
    }

    var j = e.target.closest('[data-jump]');
    if (j && sess) { sess.cur = +j.getAttribute('data-jump'); saveSess(); render(true); return; }

    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'start-exam': startSession('exam'); break;
      case 'start-unit': startSession('unitexam', document.getElementById('unit-sel').value); break;
      case 'start-quick': startSession('quick'); break;
      case 'start-topic': startSession('topic', b.getAttribute('data-topic')); break;
      case 'start-topic-sel': startSession('topic', document.getElementById('topic-sel').value); break;
      case 'start-wrong': startSession('wrong'); break;
      case 'practice-these': startSession('wrong', b.getAttribute('data-ids').split(',')); break;
      case 'prev': if (sess.cur > 0) { sess.cur--; confirmFinish = false; saveSess(); render(true); } break;
      case 'next': if (sess.cur < sess.items.length - 1) { sess.cur++; confirmFinish = false; saveSess(); render(true); } break;
      case 'finish':
        if (sess.mode === 'exam') { confirmFinish = true; render(false); var cf = view.querySelector('.confirm'); if (cf) cf.scrollIntoView({ block: 'center' }); }
        else { finishSession(); render(true); }
        break;
      case 'finish-yes': confirmFinish = false; finishSession(); render(true); break;
      case 'finish-no': confirmFinish = false; render(false); break;
      case 'quit': confirmQuit = true; render(false); break;
      case 'quit-no': confirmQuit = false; render(false); break;
      case 'quit-yes': confirmQuit = false; sess = null; saveSess(); render(true); break;
      case 'close-result': sess = null; saveSess(); render(true); break;
      case 'toggle-done': {
        var id = b.getAttribute('data-mod');
        if (state.mods[id]) delete state.mods[id]; else state.mods[id] = Date.now();
        save(); render(false); toast(state.mods[id] ? 'Módulo marcado como estudiado' : 'Módulo marcado como pendiente');
        break;
      }
      case 'mini-new': { var mEl = view.querySelector('[data-mini]'); if (mEl) { newMini(MMAP[route.id]); renderMini(mEl); } break; }
      case 'flip': fc.flip = !fc.flip; render(false); var f = view.querySelector(fc.flip ? '.face-back' : '.face-front'); if (f) f.focus(); break;
      case 'fc-know': state.cards['c' + fc.deck[fc.pos]] = 1; save(); fc.pos++; fc.flip = false; render(false); break;
      case 'fc-again': fc.deck.push(fc.deck[fc.pos]); fc.pos++; fc.flip = false; render(false); break;
      case 'fc-shuffle': buildDeck(); render(false); break;
      case 'fc-restart': buildDeck(); render(false); break;
      case 'fc-reset':
        CARDS.forEach(function (c, i) { if (inFc(c)) delete state.cards['c' + i]; });
        save(); buildDeck(); render(false); break;
    }
  });

  /* "Siguiente módulo" marca el actual como estudiado si aún no lo está */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act="next-mod"]');
    if (b) { var id = b.getAttribute('data-mod'); if (!state.mods[id]) { state.mods[id] = Date.now(); save(); } }
  }, true);

  setInterval(function () { var t = view.querySelector('[data-timer]'); if (t && sess && !sess.fin) t.textContent = mmss((Date.now() - sess.start) / 1000); }, 1000);

  render(false);
  initRemote();
})();
</script>

</body></html>
